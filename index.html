<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --card-elevated: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-focus: #10b981;
  --accent: #059669;
  --accent-hover: #047857;
  --accent-soft: rgba(5, 150, 105, 0.1);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.12);
  --expense: #f43f5e;
  --expense-soft: rgba(244, 63, 94, 0.12);
  --balance: #6366f1;
  --balance-soft: rgba(99, 102, 241, 0.12);
  --budget: #0284c7;
  --budget-soft: rgba(2, 132, 199, 0.12);
  --ok: #10b981;
  --warn: #f59e0b;
  --over: #ef4444;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-pill: 9999px;
  --nav-h: 70px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d16;
    --card: #111827;
    --card-hover: #172236;
    --card-elevated: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: #10b981;
    --accent: #10b981;
    --accent-hover: #34d399;
    --accent-soft: rgba(16, 185, 129, 0.15);
    --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
    --income: #34d399;
    --income-soft: rgba(52, 211, 153, 0.15);
    --expense: #fb7185;
    --expense-soft: rgba(251, 113, 133, 0.15);
    --balance: #818cf8;
    --balance-soft: rgba(129, 140, 248, 0.15);
    --budget: #38bdf8;
    --budget-soft: rgba(56, 189, 248, 0.15);
    --ok: #34d399;
    --warn: #fbbf24;
    --over: #f87171;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 16px 40px -4px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d16;
  --card: #111827;
  --card-hover: #172236;
  --card-elevated: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: #10b981;
  --accent: #10b981;
  --accent-hover: #34d399;
  --accent-soft: rgba(16, 185, 129, 0.15);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #34d399;
  --income-soft: rgba(52, 211, 153, 0.15);
  --expense: #fb7185;
  --expense-soft: rgba(251, 113, 133, 0.15);
  --balance: #818cf8;
  --balance-soft: rgba(129, 140, 248, 0.15);
  --budget: #38bdf8;
  --budget-soft: rgba(56, 189, 248, 0.15);
  --ok: #34d399;
  --warn: #fbbf24;
  --over: #f87171;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 16px 40px -4px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.25);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --card-elevated: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-focus: #059669;
  --accent: #059669;
  --accent-hover: #047857;
  --accent-soft: rgba(5, 150, 105, 0.1);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.12);
  --expense: #f43f5e;
  --expense-soft: rgba(244, 63, 94, 0.12);
  --balance: #6366f1;
  --balance-soft: rgba(99, 102, 241, 0.12);
  --budget: #0284c7;
  --budget-soft: rgba(2, 132, 199, 0.12);
  --ok: #10b981;
  --warn: #f59e0b;
  --over: #ef4444;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body {
  width: 100%;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 16px calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px));
}
header.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 16px;
  width: 100%;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: var(--shadow-glow);
  flex-shrink: 0;
}
.brand-title {
  font-size: 1.25rem;
  font-weight: 850;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.sync {
  font-size: 0.75rem;
  min-height: 1.2em;
  margin-top: 3px;
}
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.sync-dot.online { background: var(--income); box-shadow: 0 0 6px var(--income); }
.sync-dot.saving { background: var(--warn); }
.sync-dot.offline { background: var(--text-muted); }
.sync-dot.local { background: var(--budget); }

.banner {
  background: var(--accent-soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  width: 100%;
}
.card-title {
  font-size: 1rem;
  font-weight: 750;
  letter-spacing: -0.01em;
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-subtitle {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* Dashboard Two-Column Grid on Desktop */
.dash-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  width: 100%;
}
@media (min-width: 900px) {
  .dash-layout {
    grid-template-columns: 1.15fr 0.85fr;
    gap: 20px;
    align-items: start;
  }
}
.dash-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  min-width: 0;
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  margin-bottom: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  width: 100%;
}
.month-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  font-weight: 750;
}
.nav-arrow {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.nav-arrow:hover {
  background: var(--card-hover);
  border-color: var(--accent);
  color: var(--accent);
}

/* Hero Highlight Card */
.hero-card {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.05) 100%);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  width: 100%;
}
.hero-card.over-budget {
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.12) 0%, rgba(239, 68, 68, 0.05) 100%);
  border-color: rgba(244, 63, 94, 0.35);
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  width: 100%;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  min-width: 0;
}
.hero-card.over-budget .hero-badge { color: var(--over); }
.hero-days {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.hero-amount {
  font-size: 1.85rem;
  font-weight: 850;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  line-height: 1.15;
  word-break: break-all;
}
.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  max-width: 100%;
}

/* 4-Stat Grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
  width: 100%;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.stat-icon.income { background: var(--income-soft); color: var(--income); }
.stat-icon.expense { background: var(--expense-soft); color: var(--expense); }
.stat-icon.balance { background: var(--balance-soft); color: var(--balance); }
.stat-icon.budget { background: var(--budget-soft); color: var(--budget); }
.stat-val {
  font-size: 1.15rem;
  font-weight: 750;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-val.income { color: var(--income); }
.stat-val.expense { color: var(--expense); }

/* Category Bars */
.cat-bar-item { margin-bottom: 12px; }
.cat-bar-item:last-child { margin-bottom: 0; }
.cat-bar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.88rem;
}
.cat-bar-name {
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.cat-bar-badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent);
  flex-shrink: 0;
}
.cat-bar-amount {
  font-weight: 700;
  white-space: nowrap;
  margin-left: 8px;
}
.bar-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  width: 100%;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.3s ease;
}
.bar-fill.ok { background: var(--ok); }
.bar-fill.warn { background: var(--warn); }
.bar-fill.over { background: var(--over); }
.bar-fill.budget { background: var(--budget); }

/* Trend Chart */
.legend {
  display: flex;
  gap: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.legend-dot.income { background: var(--income); }
.legend-dot.expense { background: var(--expense); }

/* Smart Insights */
.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 0.88rem;
  line-height: 1.45;
}
.insight-item:last-child { margin-bottom: 0; }
.insight-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--card);
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.chip svg { color: var(--accent); }
.chip-amount {
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 1px 6px;
  border-radius: 99px;
  font-size: 0.75rem;
}

/* Transaction List */
.tx-group { padding: 0; margin-bottom: 12px; width: 100%; }
.tx-group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--card-hover);
  border-bottom: 1px solid var(--border);
}
.tx-group-date {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 700;
}
.tx-group-total {
  font-size: 0.82rem;
  font-weight: 700;
}
.tx-group-total.income { color: var(--income); }
.tx-group-total.expense { color: var(--expense); }
.tx-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.tx-row:last-child { border-bottom: 0; }
.tx-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.tx-avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tx-avatar.income { background: var(--income-soft); color: var(--income); }
.tx-avatar.expense { background: var(--expense-soft); color: var(--expense); }
.tx-info { min-width: 0; flex: 1; }
.tx-name { font-weight: 650; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-note { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount { font-weight: 750; font-size: 0.95rem; }
.tx-amount.income { color: var(--income); }
.tx-amount.expense { color: var(--expense); }
.tx-actions { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }

/* Budget Items */
.budget-item-card { margin-bottom: 12px; width: 100%; }
.budget-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.budget-cat-name { font-size: 1rem; font-weight: 700; }
.budget-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 500;
}
.budget-remain { font-weight: 700; }
.budget-remain.ok { color: var(--ok); }
.budget-remain.warn { color: var(--warn); }
.budget-remain.over { color: var(--over); }
.budget-inline-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.budget-inline-edit input {
  max-width: 160px;
  height: 36px;
  padding: 4px 10px;
}
.budget-copy-card {
  background: var(--accent-soft);
  border-color: var(--accent);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; }
.empty-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 12px; color: var(--text); }

/* Buttons & Inputs */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--card);

function icon(name, size = 18, cls = "") {
  const svgNS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(svgNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", String(size));
  s.setAttribute("height", String(size));
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  if (cls) s.setAttribute("class", cls);
  const raw = ICONS[name];
  if (raw) {
    const parser = new DOMParser();
    const doc = parser.parseFromString('<svg xmlns="http://www.w3.org/2000/svg">' + raw + '</svg>', "image/svg+xml");
    while (doc.documentElement.firstChild) {
      s.appendChild(doc.documentElement.firstChild);
    }
  }
  return s;
}

function pad(n) { return String(n).padStart(2, "0"); }
function localDate(d = new Date()) {
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
  return `${y}-${m}-${day}`;
}
function monthKey(d = new Date()) {
  if (typeof d === "string") return d.slice(0, 7);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addMonths(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function daysInMonth(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function daysLeftInMonth(key) {
  const today = localDate();
  if (monthKey(today) !== key) return 0;
  const now = parseDate(today);
  const total = daysInMonth(key);
  return Math.max(0, total - now.getDate());
}
function uid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function nowIso() { return new Date().toISOString(); }

const nfId = new Intl.NumberFormat("id-ID");
function rp(n) {
  const v = Math.round(Number(n) || 0);
  return "Rp " + nfId.format(v);
}
function compact(n) {
  const num = Math.abs(Number(n) || 0);
  if (state.lang === "en") {
    if (num >= 1000000) {
      const v = (num / 1000000).toFixed(1).replace(".0", "");
      return v + "M";
    }
    if (num >= 1000) {
      const v = Math.round(num / 1000);
      return v + "k";
    }
    return String(num);
  }
  if (num >= 1000000) {
    const v = (num / 1000000).toFixed(1).replace(".0", "").replace(".", ",");
    return v + "jt";
  }
  if (num >= 1000) {
    const v = Math.round(num / 1000);
    return v + "rb";
  }
  return String(num);
}

  return str;
}

let audioContext = null;
let lastClickSoundAt = 0;
function playChime(kind = "pop") {
  try {
    if (!isSoundEnabled()) return;
    const stamp = performance.now();
    if (stamp - lastClickSoundAt < 110) return;
    lastClickSoundAt = stamp;
    if (navigator.vibrate) {
      try {
        if (kind === "coin") navigator.vibrate([25, 40, 25]);
        else navigator.vibrate(18);
      } catch {}
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = audioContext || (audioContext = new AudioCtx());
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (kind === "coin") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.06);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.start(now);
      osc.stop(now + 0.07);
    }
  } catch {}
}

// One delegated feedback handler covers dynamically-rendered controls without bubbling duplicates.
document.addEventListener("click", event => {
  if (!(event instanceof MouseEvent) || !event.isTrusted) return;
  const target = event.target instanceof Element ? event.target : null;
  const control = target?.closest('button:not(:disabled), a[href], [role="button"]:not([aria-disabled="true"]), input[type="checkbox"]:not(:disabled), input[type="radio"]:not(:disabled), select:not(:disabled), summary');
  if (!control || control.hasAttribute("data-sound-action") || control.closest("[aria-hidden='true']")) return;
  // Let control handlers play any deliberate coin/pop cue first; add generic feedback only if none did.
  const cueAtClick = lastClickSoundAt;
  queueMicrotask(() => {
    if (lastClickSoundAt === cueAtClick) playChime("pop");
  });
}, true);

function handleUrlActions() {

    if (action === "newtx") {

        }
      }, 350);
    }
  } catch {}
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (k === "style") node.setAttribute("style", v);
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    node.append(c.nodeType ? c : String(c));
  }
  return node;
}
function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function toast(msg, action) {
  const wrap = $("#toasts");
  if (!wrap) return;
  if ([...wrap.children].some(c => c.textContent.includes(msg))) return;
  const t = el("div", { class: "toast", role: "status" }, [
    el("span", { text: msg }),
    action ? el("button", {
      type: "button", class: "btn-link", text: action.label,
      onclick: () => { action.fn(); t.remove(); },
      style: "color:#10b981;font-weight:700;margin-left:8px;"
    }) : null
  ]);
  wrap.append(t);
  setTimeout(() => t.remove(), 4000);
}

const STORAGE_PREFIX = "duitku.";
function loadLocal() {
  try {
    const c = localStorage.getItem(STORAGE_PREFIX + "categories");
    const txs = localStorage.getItem(STORAGE_PREFIX + "transactions");
    const b = localStorage.getItem(STORAGE_PREFIX + "budgets");
    const g = localStorage.getItem(STORAGE_PREFIX + "goals");
    const a = localStorage.getItem(STORAGE_PREFIX + "allowance");
    const p = localStorage.getItem(STORAGE_PREFIX + "pending");
    state.categories = c ? JSON.parse(c) : [];
    state.transactions = txs ? JSON.parse(txs) : [];
    state.budgets = b ? JSON.parse(b) : [];
    state.goals = g ? JSON.parse(g) : [];
    state.allowance = a ? Object.assign({ amount: 20000, enabled: true, lastClaim: "" }, JSON.parse(a)) : { amount: 20000, enabled: true, lastClaim: "" };
    state.pending = p ? JSON.parse(p) : [];
    seedIfEmpty();
  } catch (err) {
    seedIfEmpty();
  }
}
function saveLocal() {
  try {
    localStorage.setItem(STORAGE_PREFIX + "categories", JSON.stringify(state.categories));
    localStorage.setItem(STORAGE_PREFIX + "transactions", JSON.stringify(state.transactions));
    localStorage.setItem(STORAGE_PREFIX + "budgets", JSON.stringify(state.budgets));
    localStorage.setItem(STORAGE_PREFIX + "goals", JSON.stringify(state.goals));
    localStorage.setItem(STORAGE_PREFIX + "allowance", JSON.stringify(state.allowance));
    localStorage.setItem(STORAGE_PREFIX + "pending", JSON.stringify(state.pending));
  } catch (err) {}
}

function catById(id) {

  const c = catById(id);

function activeCats(type) {
  return state.categories.filter(c => !c.archived && (!type || c.type === type))
    .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name));

function seedIfEmpty() {
  if (state.categories.length) return;
  let order = 0;
  for (const name of DEFAULT_EXPENSE) {
    state.categories.push({ id: uid(), name, type: "expense", archived: false, sort_order: order++ });
  }
  for (const name of DEFAULT_INCOME) {
    state.categories.push({ id: uid(), name, type: "income", archived: false, sort_order: order++ });
  }
}

let isBootingCloud = false;
async function bootCloud() {
  // 1. Instant render from local cache (0ms perceived wait)
  loadLocal();
  $("#mainNav").style.display = "";
  if (state.screen === "auth") state.screen = "dashboard";
  render();
  hideSplash();
  handleUrlActions();

  // 2. Background sync with cloud (deduplicated)
  if (isBootingCloud) return;
  isBootingCloud = true;
  setSync(t("sync_saving"), "saving");
  showBanner("");
  try {
    await loadAllCloud();
    subscribeRealtime();
    await offerUpload();
    setSync(t("sync_online"), "online");
  } catch (err) {
    console.warn("Sync warning:", err);
    setSync(t("sync_offline"), "offline");
  } finally {
    isBootingCloud = false;
    render();
  }
}

async function initBackend() {
  const { SUPABASE_URL, SUPABASE_ANON_KEY } = cfg();
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
    enterLocal(t("banner_local"));
    hideSplash();
    return;
  }
  state.mode = "cloud";
  try {
    state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "duitku.auth" },
    });
    const { data: { session } } = await state.sb.auth.getSession();
    if (session?.user) {
      try { localStorage.removeItem("duitku_local_preferred"); } catch {}
      state.user = session.user;
      bootCloud();
    } else if (localStorage.getItem("duitku_local_preferred") === "1") {
      enterLocal();
    } else {
      renderAuth();
      hideSplash();
    }
    state.sb.auth.onAuthStateChange(async (event, sess) => {
      if (event === "SIGNED_OUT") {
        state.user = null;
        teardownRealtime();
        renderAuth();
        hideSplash();
        return;
      }
      if (sess?.user) {
        state.user = sess.user;
        if (event === "SIGNED_IN" || event === "USER_UPDATED") {
          bootCloud();
        }
      }
    });
    // keep session alive: nudge token refresh even when tab is idle in background
    setInterval(async () => {
      if (!state.user || !state.sb) return;
      try {
        const { data } = await state.sb.auth.getSession();
        if (!data.session && state.user) {
          state.user = null;
          teardownRealtime();
          renderAuth();
          hideSplash();
        }
      } catch {}
    }, 5 * 60 * 1000);
  } catch (err) {
    enterLocal(t("banner_cloud_fail"));
    hideSplash();
  }
}

function enterLocal(msg) {
  try { localStorage.setItem("duitku_local_preferred", "1"); } catch {}
  state.mode = "local";

async function pageAll(table, select = "*", orderCol = "created_at", ascending = true) {
  const PAGE_SZ = 1000;
  let from = 0;
  const all = [];
  while (true) {
    const { data, error } = await state.sb
      .from(table)
      .select(select)
      .order(orderCol, { ascending })
      .range(from, from + PAGE_SZ - 1);
    if (error) throw error;
    all.push(...(data || []));
    if (!data || data.length < PAGE_SZ) break;
    from += PAGE_SZ;
  }
  return all;
}

async function loadAllCloud() {
  try {
    const [cats, txs, buds, goals, settingsRows] = await Promise.all([
      pageAll("categories", "*", "sort_order", true),
      pageAll("transactions", "*", "date", false),
      pageAll("budgets", "*", "month", true),
      pageAll("goals", "*", "created_at", false),
      state.sb.from("app_settings").select("*").eq("user_id", state.user.id).maybeSingle(),
    ]);
    state.categories = cats;
    state.transactions = txs;
    state.budgets = buds;
    state.goals = goals;
    if (settingsRows && !settingsRows.error && settingsRows.data && settingsRows.data.data) {
      const d = settingsRows.data.data || {};
      state.allowance = {
        amount: Number(d.daily_allowance_amount) || 20000,
        enabled: d.daily_allowance_enabled !== false,
        lastClaim: d.last_claim_date || "",
      };
    }
    if (!cats.length) await pushSeedCategories();
    saveLocal();
    flushQueue();
  } catch (err) {
    toast("Gagal memuat dari cloud: " + (err.message || err));
  }
}

async function pushSeedCategories() {
  seedIfEmpty();
  const rows = state.categories.map(c => ({
    id: c.id, name: c.name, type: c.type, archived: c.archived, sort_order: c.sort_order, user_id: state.user.id
  }));
  const { error } = await state.sb.from("categories").insert(rows);
  if (error) toast("Gagal membuat kategori bawaan: " + error.message);
}

async function offerUpload() {
  let localTxs = [];
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + "transactions");
    localTxs = raw ? JSON.parse(raw) : [];
  } catch {}
  if (localTxs.length && !state.transactions.length) {
    showBanner("Ada data lokal di perangkat ini. Upload ke akun cloud?", {
      label: t("btn_upload_local"),
      fn: () => uploadAllLocal(),
    });
  }
}

async function uploadAllLocal() {
  setSync(t("sync_saving"), "saving");
  try {
    const c = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "categories") || "[]");
    const localTxs = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "transactions") || "[]");
    const b = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "budgets") || "[]");
    if (c.length) {
      await state.sb.from("categories").upsert(c.map(x => ({ ...x, user_id: state.user.id })), { onConflict: "id" });
    }
    if (localTxs.length) await insertChunked("transactions", localTxs.map(x => ({ ...x, user_id: state.user.id })));
    if (b.length) {
      await state.sb.from("budgets").upsert(b.map(x => ({ ...x, user_id: state.user.id })), { onConflict: "user_id,month,category_id" });
    }
    toast("Data lokal berhasil di-upload.");
    await loadAllCloud();
    render();
  } catch (err) {
    toast("Gagal upload data: " + (err.message || err));
  } finally {
    setSync(t("sync_online"), "online");
  }
}

async function insertChunked(table, rows) {
  const CHUNK = 500;
  for (let i = 0; i < rows.length; i += CHUNK) {
    const slice = rows.slice(i, i + CHUNK);
    const { error } = await state.sb.from(table).insert(slice);
    if (error) throw error;
  }
}

function subscribeRealtime() {
  teardownRealtime();
  if (!state.sb || !state.user) return;
  state.channel = state.sb
    .channel("duitku-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "transactions" }, p => applyChange("transactions", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "categories" }, p => applyChange("categories", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "budgets" }, p => applyChange("budgets", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "goals" }, p => applyChange("goals", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "app_settings" }, p => applyChange("app_settings", p))
    .subscribe();
}

function teardownRealtime() {
  if (state.channel && state.sb) {
    state.sb.removeChannel(state.channel);
    state.channel = null;
  }
}

function applyChange(table, payload) {
  const { eventType, new: n, old: o } = payload;

  if (table === "app_settings") {
    const d = (n && n.data) || {};
    state.allowance = {
      amount: Number(d.daily_allowance_amount) || 20000,
      enabled: d.daily_allowance_enabled !== false,
      lastClaim: d.last_claim_date || "",
    };
    saveLocal();
    render();
    return;
  }

  const target = state[table];
  if (!target) return;
  const key = rowKey(table, n || o);
  if (state.writing.has(key)) return;

  if (eventType === "INSERT") {
    if (!target.some(x => sameRow(table, x, n))) target.push(n);
  } else if (eventType === "UPDATE") {
    const i = target.findIndex(x => sameRow(table, x, n));
    if (i >= 0) {
      if ((n.updated_at || "") >= (target[i].updated_at || "")) target[i] = n;
    } else target.push(n);
  } else if (eventType === "DELETE") {
    const i = target.findIndex(x => sameRow(table, x, o));
    if (i >= 0) target.splice(i, 1);
  }
  saveLocal();
  render();
}

function rowKey(table, r) {
  if (!r) return "";
  if (table === "budgets") return `budgets:${r.month}:${r.category_id}`;
  return `${table}:${r.id}`;
}
function sameRow(table, a, b) {
  if (!a || !b) return false;
  if (table === "budgets") return a.month === b.month && a.category_id === b.category_id;
  return a.id === b.id;
}

async function cloudWrite(table, op, row /* was t */, match) {
  if (state.mode !== "cloud") return;
  const key = rowKey(table, row || match);
  state.writing.add(key);
  setSync(t("sync_saving"), "saving");
  try {
    if (!state.online) {
      state.pending.push({ table, op, row, match });
      saveLocal();
      setSync(t("sync_offline"), "offline");
      return;
    }
    const q = state.sb.from(table);
    let res;
    if (op === "insert") res = await q.insert({ ...strip(row), user_id: state.user.id });
    else if (op === "update") res = await q.update(strip(row)).match(match);
    else if (op === "upsert") res = await q.upsert({ ...strip(row), user_id: state.user.id });
    else if (op === "delete") res = await q.delete().match(match);
    if (res?.error) throw res.error;
    setSync(t("sync_online"), "online");
  } catch (err) {
    setSync(t("sync_offline"), "offline");
    state.pending.push({ table, op, row, match });
    saveLocal();
    throw err;
  } finally {
    setTimeout(() => state.writing.delete(key), 800);
  }
}
function strip(r) {
  const o = { ...r };
  delete o.user_id;
  return o;
}

window.addEventListener("online", () => {
  state.online = true;
  setSync(t("sync_online"), "online");
  flushQueue();
  if (state.mode === "cloud" && state.user) loadAllCloud().then(render);
});
window.addEventListener("offline", () => {
  state.online = false;
  setSync(t("sync_offline"), "offline");
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.mode === "cloud" && state.user && state.online) {
    loadAllCloud().then(render);
  }
});

async function flushQueue() {
  if (!state.pending.length || !state.sb || !state.online) return;
  setSync(t("sync_saving"), "saving");
  const q = [...state.pending];
  state.pending = [];
  saveLocal();
  for (const item of q) {
    try {
      await cloudWrite(item.table, item.op, item.row, item.match);
    } catch {
      state.pending.push(item);
      saveLocal();
      break;
    }
  }
  setSync(state.pending.length ? "Offline" : "Tersinkron", state.pending.length ? "offline" : "online");
}

/* ---------- aggregates ---------- */
function txInMonth(key) {
  return state.transactions.filter(t => t.date.slice(0, 7) === key);
}
function sumType(list, type) {
  return list.filter(t => t.type === type).reduce((s, t) => s + Number(t.amount || 0), 0);
}
function spentByCat(key) {
  const map = new Map();
  for (const t of txInMonth(key)) {
    if (t.type !== "expense") continue;
    map.set(t.category_id, (map.get(t.category_id) || 0) + Number(t.amount || 0));
  }
  return map;
}
function budgetsFor(key) {
  return state.budgets.filter(b => b.month === key);
}

/* ---------- balance-based model ---------- */
function totalIncome() {
  return state.transactions.filter(t => t.type === "income").reduce((s, t) => s + Number(t.amount || 0), 0);
}
function totalExpense() {
  return state.transactions.filter(t => t.type === "expense").reduce((s, t) => s + Number(t.amount || 0), 0);
}
function balance() {
  return totalIncome() - totalExpense();
}
function allowanceClaimedToday() {
  return state.allowance.lastClaim === localDate();
}
function activeGoals(kind) {
  return state.goals.filter(g => g.kind === kind && g.status === "active");
}
function doneGoals(kind) {
  return state.goals.filter(g => g.kind === kind && g.status === "done");
}

async function claimAllowance() {
  if (!state.allowance.enabled) return toast(t("allowance_off"));
  if (allowanceClaimedToday()) return toast(t("allowance_claimed"));
  const amount = Number(state.allowance.amount) || 0;
  if (amount <= 0) return;
  let cat = state.categories.find(c => c.type === "income" && !c.archived && (c.name === "Uang Saku" || c.name === "Allowance"));
  if (!cat) {
    cat = { id: uid(), name: "Uang Saku", type: "income", archived: false, sort_order: state.categories.length };
    state.categories.push(cat);
    try { await cloudWrite("categories", "insert", cat); } catch {}
  }
  const row = { id: uid(), date: localDate(), type: "income", amount, category_id: cat.id, note: t("allowance_title"), source: "allowance", created_at: nowIso(), updated_at: nowIso() };
  state.transactions.push(row);
  state.allowance.lastClaim = localDate();
  saveLocal();
  render();
  try { await cloudWrite("transactions", "insert", row); } catch {}
  await saveAllowanceSetting();
  toast(t("toast_tx_logged", { name: catNameById(cat.id), amount: rp(amount) }));
}

async function saveAllowanceSetting() {
  if (state.mode !== "cloud" || !state.user || !state.sb) return;
  const data = { daily_allowance_amount: state.allowance.amount, daily_allowance_enabled: state.allowance.enabled, last_claim_date: state.allowance.lastClaim };
  try { await state.sb.from("app_settings").upsert({ user_id: state.user.id, data }); } catch {}
}

function goalExpenseCat() {
  let cat = state.categories.find(c => c.type === "expense" && !c.archived && c.name === "Lainnya");
  if (!cat) cat = state.categories.find(c => c.type === "expense" && !c.archived);
  if (!cat) {
    cat = { id: uid(), name: "Lainnya", type: "expense", archived: false, sort_order: state.categories.length };
    state.categories.push(cat);

function openGoalForm(kind, existing) {
  openModal(existing ? (state.lang === "en" ? "Edit Goal" : "Ubah Target") : t("goal_add_title"), (body, close) => {
    const name = el("input", { type: "text", value: existing?.name || "", placeholder: t("goal_name_ph"), maxlength: "80", required: "true" });
    const amount = el("input", { type: "text", inputmode: "numeric", value: existing?.amount ? formatThousands(String(existing.amount)) : "", placeholder: t("goal_amount_ph") });
    amount.addEventListener("input", () => { amount.value = formatThousands(amount.value.replace(/\D/g, "")); });
    const due = el("input", { type: "date", value: existing?.due || "" });
    const note = el("input", { type: "text", value: existing?.note || "", placeholder: t("goal_note_ph"), maxlength: "200" });
    body.append(
      field(t("goal_add_name"), name),
      field(t("goal_add_amount"), amount),
      field(t("goal_due"), due),
      field(t("goal_note_ph"), note),
      el("button", { type: "button", class: "btn btn-primary full-width", style: "margin-top:10px;", text: t("goal_add_btn"), onclick: async () => {
        const val = Number(String(amount.value).replace(/\D/g, ""));
        if (!name.value.trim()) return toast(state.lang === "en" ? "Name is required." : "Nama wajib diisi.");
        if (!val || val <= 0) return toast(state.lang === "en" ? "Amount must be greater than 0." : "Jumlah harus lebih dari 0.");
        if (existing) {
          existing.name = name.value.trim();
          existing.amount = val;
          existing.due = due.value || null;
          existing.note = note.value.trim();
          existing.updated_at = nowIso();
          saveLocal(); close(); render();
          try { await cloudWrite("goals", "update", { name: existing.name, amount: existing.amount, due: existing.due, note: existing.note }, { id: existing.id }); } catch (e) { toast("Gagal memperbarui target: " + (e.message || e)); }
        } else {
          const row = { id: uid(), name: name.value.trim(), amount: val, kind, status: "active", paid: 0, due: due.value || null, note: note.value.trim(), created_at: nowIso(), updated_at: nowIso() };
          state.goals.push(row);
          saveLocal(); close(); render();
          try { await cloudWrite("goals", "insert", row); } catch (e) { rollbackGoal(row.id); toast("Gagal menyimpan target: " + (e.message || e)); }
        }
      }})
    );
    setTimeout(() => name.focus(), 60);
  });
}
function rollbackGoal(id) {
  const i = state.goals.findIndex(g => g.id === id);
  if (i >= 0) state.goals.splice(i, 1);
  saveLocal(); render();
}
async function approveGoal(g) {
  const isEn = state.lang === "en";
  if (balance() < g.amount) return toast(isEn ? "Balance is not enough yet." : "Saldo belum cukup.");
  if (!confirm(t("goal_confirm_approve", { name: g.name, amount: rp(g.amount) }))) return;
  const cat = goalExpenseCat();
  const row = { id: uid(), date: localDate(), type: "expense", amount: Number(g.amount), category_id: cat.id, note: g.name, source: "goal", created_at: nowIso(), updated_at: nowIso() };
  state.transactions.push(row);
  g.status = "done";
  g.paid = Number(g.amount);
  g.tx_id = row.id;
  g.updated_at = nowIso();
  saveLocal();
  playChime("coin");
  render();
  try {
    await cloudWrite("transactions", "insert", row);
    await cloudWrite("goals", "update", { status: "done", paid: g.paid, tx_id: g.tx_id }, { id: g.id });
    toast(isEn ? "Goal realized!" : "Target terealisasi!");
  } catch (e) { toast("Gagal sinkron target: " + (e.message || e)); }
}
async function deleteGoal(g) {
  const i = state.goals.findIndex(x => x.id === g.id);
  if (i >= 0) state.goals.splice(i, 1);
  saveLocal(); render();
  try { await cloudWrite("goals", "delete", null, { id: g.id }); } catch {}
}

function studentRunwayWidget() {
  const bal = balance();
  const now = new Date();
  const dayOfMonth = Math.max(1, now.getDate());
  const list = txInMonth(state.month);
  const monthExpense = list.filter(t => t.type === "expense").reduce((s, t) => s + Number(t.amount || 0), 0);
  const isEn = state.lang === "en";
  const dailyBurn = monthExpense > 0 ? Math.round(monthExpense / dayOfMonth) : 0;

  const card = el("div", { class: "runway-card" });
  let iconEmoji = "🛡️";
  let statusBadge = isEn ? "Safe" : "Kas Aman";
  let badgeCls = "ok";
  let desc = "";

  if (bal <= 0) {
    iconEmoji = "🚨";
    statusBadge = isEn ? "Empty" : "Saldo Habis";
    badgeCls = "over";
    desc = isEn
      ? "Your balance is 0. Log income or claim your daily allowance."
      : "Saldo kamu habis. Catat pemasukan atau klaim uang saku harian.";
  } else if (dailyBurn === 0) {
    iconEmoji = "🌱";
    statusBadge = isEn ? "Fresh" : "Terkendali";
    badgeCls = "ok";
    desc = isEn
      ? "No big expenses recorded yet this month. Keep it up!"
      : "Belum ada pengeluaran besar bulan ini. Pertahankan gaya hematmu!";
  } else {
    const rawDays = Math.floor(bal / dailyBurn);
    const allowAmt = state.allowance?.enabled ? Number(state.allowance.amount || 0) : 0;

    if (rawDays >= 20) {
      iconEmoji = "🌟";
      statusBadge = isEn ? "Very Safe" : "Sangat Sehat";
      badgeCls = "ok";
    } else if (rawDays >= 7) {
      iconEmoji = "⚡";
      statusBadge = isEn ? "Moderate" : "Cukup Aman";
      badgeCls = "warn";
    } else {
      iconEmoji = "⚠️";
      statusBadge = isEn ? "Critical" : "Waspada Kritis";
      badgeCls = "over";
    }

    if (allowAmt > 0 && dailyBurn > allowAmt) {
      const netBurn = dailyBurn - allowAmt;
      const daysWithAllow = Math.floor(bal / netBurn);
      desc = isEn
        ? `Burn rate ~${rp(dailyBurn)}/day. With allowance (+${rp(allowAmt)}/day), cash lasts ~${daysWithAllow} days.`
        : `Jajan rata-rata ~${rp(dailyBurn)}/hari. Dengan uang saku (+${rp(allowAmt)}/hari), kas bertahan ~${daysWithAllow} hari.`;
    } else if (allowAmt >= dailyBurn) {
      desc = isEn
        ? `Burn rate ~${rp(dailyBurn)}/day is fully covered by your daily allowance (+${rp(allowAmt)}/day)!`
        : `Pengeluaran ~${rp(dailyBurn)}/hari tertutup penuh oleh uang saku harian (+${rp(allowAmt)}/hari)!`;
    } else {
      desc = isEn
        ? `At current pace (~${rp(dailyBurn)}/day), cash can last approx. ${rawDays} more days.`
        : `Dengan kecepatan jajan sekarang (~${rp(dailyBurn)}/hari), saldo bertahan ~${rawDays} hari lagi.`;
    }
  }

  const iconEl = el("div", { class: "runway-icon", text: iconEmoji });
  const bodyEl = el("div", { class: "runway-body" });
  const titleRow = el("div", { class: "runway-title-row" });
  titleRow.append(
    el("span", { class: "runway-title", text: isEn ? "Cash Runway Insight" : "Ketahanan Kas Mahasiswa" }),
    el("span", { class: "runway-badge " + badgeCls, text: statusBadge })
  );
  bodyEl.append(titleRow, el("div", { class: "runway-desc", text: desc }));
  card.append(iconEl, bodyEl);
  return card;
}

function trendCard(key) {
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(addMonths(key, -i));
  const series = months.map(m => {
    const list = txInMonth(m);
    return { m, income: sumType(list, "income"), expense: sumType(list, "expense") };
  });
  const allVals = series.flatMap(s => [s.income, s.expense]);
  const hasData = allVals.some(v => v > 0);
  const max = Math.max(1, ...allVals);

  const card = el("div", { class: "card" });
  const head = el("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;" });
  head.append(el("h2", { class: "card-title", style: "margin:0;", text: t("card_trend_6m") }));

  const legend = el("div", { class: "legend" }, [
    el("span", { class: "legend-item" }, [el("span", { class: "legend-dot income" }), el("span", { text: t("filter_income") })]),
    el("span", { class: "legend-item" }, [el("span", { class: "legend-dot expense" }), el("span", { text: t("filter_expense") })]),
  ]);
  head.append(legend);
  card.append(head);

  const W = 360, H = 160, pad = 36;
  const gw = (W - pad) / series.length;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + (H + 30));
  svg.setAttribute("width", "100%");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Grafik pemasukan dan pengeluaran 6 bulan");

  for (const yFrac of [0.25, 0.5, 0.75, 1.0]) {
    const yPos = H - (H - 24) * yFrac;
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", pad - 8); line.setAttribute("y1", yPos);
    line.setAttribute("x2", W); line.setAttribute("y2", yPos);
    line.setAttribute("stroke", "var(--border)");
    line.setAttribute("stroke-dasharray", "3,3");
    line.setAttribute("stroke-width", "1");
    svg.append(line);
  }

  function bar(x, amount, color, label) {
    const h = hasData && amount > 0 ? Math.max(4, (amount / max) * (H - 24)) : 0;
    const r = document.createElementNS(svgNS, "rect");
    r.setAttribute("x", x);
    r.setAttribute("y", H - h);
    r.setAttribute("width", 14);
    r.setAttribute("height", h);
    r.setAttribute("rx", 4);
    r.setAttribute("fill", color);
    r.setAttribute("tabindex", "0");
    r.setAttribute("role", "button");
    const tip = label + ": " + rp(amount);
    r.setAttribute("aria-label", tip);
    const title = document.createElementNS(svgNS, "title");
    title.textContent = tip;
    r.append(title);
    r.addEventListener("click", () => toast(tip));
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toast(tip); } });
    return r;
  }

  series.forEach((s, i) => {
    const x = pad + i * gw + (gw - 32) / 2;
    if (hasData) {
      svg.append(bar(x, s.income, "var(--income)", monthLabel(s.m) + " pemasukan"));
      svg.append(bar(x + 16, s.expense, "var(--expense)", monthLabel(s.m) + " pengeluaran"));
    } else {
      const r1 = document.createElementNS(svgNS, "rect");
      r1.setAttribute("x", x); r1.setAttribute("y", H - 20); r1.setAttribute("width", 14); r1.setAttribute("height", 20);
      r1.setAttribute("rx", 4); r1.setAttribute("fill", "var(--border)"); r1.setAttribute("opacity", "0.5");
      const r2 = document.createElementNS(svgNS, "rect");
      r2.setAttribute("x", x + 16); r2.setAttribute("y", H - 20); r2.setAttribute("width", 14); r2.setAttribute("height", 20);
      r2.setAttribute("rx", 4); r2.setAttribute("fill", "var(--border)"); r2.setAttribute("opacity", "0.3");
      svg.append(r1, r2);
    }
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("x", x + 15);
    t.setAttribute("y", H + 18);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "11");
    t.setAttribute("font-weight", "500");
    t.setAttribute("fill", "var(--text-muted)");
    t.textContent = monthLabel(s.m).split(" ")[0].slice(0, 3);
    svg.append(t);
  });

  if (hasData) {
    const axis = document.createElementNS(svgNS, "text");
    axis.setAttribute("x", 2); axis.setAttribute("y", 14);
    axis.setAttribute("font-size", "10"); axis.setAttribute("font-weight", "600");
    axis.setAttribute("fill", "var(--text-muted)");
    axis.textContent = compact(max);
    svg.append(axis);
  } else {
    const emptyMsg = document.createElementNS(svgNS, "text");
    emptyMsg.setAttribute("x", W / 2); emptyMsg.setAttribute("y", H / 2);
    emptyMsg.setAttribute("text-anchor", "middle");
    emptyMsg.setAttribute("font-size", "12"); emptyMsg.setAttribute("fill", "var(--text-muted)");
    emptyMsg.textContent = t("chart_empty_msg");
    svg.append(emptyMsg);
  }

  card.append(svg);
  return card;
}

function insightsCard(key, income, expense, budgets, spentMap, remain) {
  const insights = [];
  const prevKey = addMonths(key, -1);
  const prev = txInMonth(prevKey);
  const prevExp = sumType(prev, "expense");
  for (const b of budgets) {
    const spent = spentMap.get(b.category_id) || 0;
    if (b.amount > 0 && spent > b.amount) {
      const pct = Math.round((spent - b.amount) / b.amount * 100);
      const name = catNameById(b.category_id);
      insights.push({ score: pct, text: t("insight_over", { name, pct, spent: rp(spent), budget: rp(b.amount) }) });
    }
  }
  if (prevExp > 0 && expense > 0) {
    const delta = Math.round((expense - prevExp) / prevExp * 100);
    if (delta <= -5) insights.push({ score: Math.abs(delta), text: t("insight_lower", { pct: Math.abs(delta), curr: rp(expense), prev: rp(prevExp) }) });
    else if (delta >= 5) insights.push({ score: delta, text: t("insight_higher", { pct: delta, curr: rp(expense), prev: rp(prevExp) }) });
  }
  const today = localDate();
  if (monthKey(today) === key && budgets.length && remain != null) {
    const day = parseDate(today).getDate();
    if (day >= 5) {
      const dim = daysInMonth(key);
      const projected = Math.round(expense / day * dim);
      const budgetTotal = budgets.reduce((s, b) => s + Number(b.amount), 0);
      const gap = budgetTotal - projected;
      const daily = rp(Math.round(expense / day));
      if (gap > 0) insights.push({ score: 40, text: t("insight_save", { daily, gap: rp(gap) }) });
      else if (gap < 0) insights.push({ score: 50, text: t("insight_projected_over", { daily, gap: rp(Math.abs(gap)) }) });
    }
  }
  if (expense > 0) {
    let top = null;
    for (const [id, amount] of spentMap) if (!top || amount > top.amount) top = { id, amount };
    if (top) {
      const pct = Math.round(top.amount / expense * 100);
      insights.push({ score: pct > 30 ? pct : 10, text: t("insight_top", { name: catNameById(top.id), pct }) });
    }
  }
  insights.sort((a, b) => b.score - a.score);
  const top5 = insights.slice(0, 5);
  if (!top5.length) return el("div", { style: "display:none;" });

  const card = el("div", { class: "card" });
  const head = el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:12px;" }, [
    icon("bulb", 18, "accent"),
    el("h2", { class: "card-title", style: "margin:0;", text: t("card_insights") })
  ]);
  card.append(head);
  for (const i of top5) {
    const item = el("div", { class: "insight-item" }, [
      el("div", { class: "insight-icon" }, [icon("lightning", 14)]),
      el("div", { style: "flex:1;font-weight:500;", text: i.text })
    ]);
    card.append(item);
  }
  return card;
}

/* ---------- transactions ---------- */
function filteredTx() {
  const f = state.txFilter;
  return state.transactions.filter(t => {
    if (f.month && t.date.slice(0, 7) !== f.month) return false;
    if (f.category && t.category_id !== f.category) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.q && !(t.note || "").toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.created_at < b.created_at ? 1 : -1)));
}
function recentCombos() {
  const seen = new Set();
  const out = [];
  const sorted = [...state.transactions].sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  for (const t of sorted) {
    const k = t.category_id + ":" + t.amount;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(t);
    if (out.length === 5) break;
  }
  return out;
}

function renderList() {
  const host = $("#txList");
  if (!host) return;
  clear(host);
  const all = filteredTx();
  const slice = all.slice(0, state.txShown);
  if (!slice.length) {
    host.append(el("div", { class: "card empty-state" }, [
      el("div", { class: "empty-icon", text: "📝" }),
      el("p", { class: "empty-title", text: state.transactions.length ? t("empty_tx_filtered") : t("empty_tx_empty") }),
      el("button", { type: "button", class: "btn btn-primary", text: t("btn_new_tx"), onclick: () => openTxForm() }),
    ]));
    return;
  }
  let current = "";
  let group;
  for (const t of slice) {
    if (t.date !== current) {
      current = t.date;
      const dayTotal = all.filter(x => x.date === t.date).reduce((s, x) => s + (x.type === "expense" ? -Number(x.amount) : Number(x.amount)), 0);
      group = el("div", { class: "card tx-group" });
      const groupHeader = el("div", { class: "tx-group-header" }, [

          icon("calendar", 14, "muted"),
          el("strong", { text: t.date })
        ]),
        el("span", { class: "tx-group-total " + (dayTotal >= 0 ? "income" : "expense"), text: (dayTotal >= 0 ? "+" : "") + rp(dayTotal) }),
      ]);
      group.append(groupHeader);
      host.append(group);
    }
    const name = catNameById(t.category_id);
    const row = el("div", { class: "tx-row" });
    const left = el("div", { class: "tx-left" });
    const iconWrap = el("div", { class: "tx-avatar " + (t.type === "income" ? "income" : "expense") }, [
      icon(t.type === "income" ? "arrowDownLeft" : "arrowUpRight", 16)
    ]);
    const info = el("div", { class: "tx-info" });
    info.append(el("div", { class: "tx-name", text: name }));
    if (t.note) info.append(el("div", { class: "tx-note", text: t.note }));
    left.append(iconWrap, info);
    row.append(left);

    const right = el("div", { class: "tx-right" });
    right.append(el("div", { class: "tx-amount " + (t.type === "income" ? "income" : "expense"), text: (t.type === "income" ? "+" : "-") + rp(t.amount) }));
    const actions = el("div", { class: "tx-actions" });
    actions.append(
      el("button", { type: "button", class: "btn-icon-subtle", "aria-label": "Ubah transaksi", onclick: () => openTxForm(t) }, [icon("edit", 14)]),
      el("button", { type: "button", class: "btn-icon-subtle danger", "aria-label": "Hapus transaksi", onclick: () => deleteTx(t) }, [icon("trash", 14)]),
    );
    right.append(actions);
    row.append(right);
    group.append(row);
  }
  if (all.length > slice.length) {
    host.append(el("button", {
      type: "button", class: "btn full-width", style: "margin-top:12px;", text: t("btn_load_more"),
      onclick: () => { state.txShown += PAGE; renderList(); }
    }));
  }
}

async function quickAdd(src) {
  const row = {
    id: uid(), date: localDate(), type: src.type, amount: src.amount,
    category_id: src.category_id, note: src.note || "", created_at: nowIso(), updated_at: nowIso(),
  };
  state.transactions.push(row);
  saveLocal();
  playChime(src.type === "income" ? "coin" : "pop");
  render();
  try {
    await cloudWrite("transactions", "insert", row);
    toast(t("toast_tx_logged", { name: catNameById(src.category_id), amount: rp(src.amount) }));
  } catch (err) {
    rollbackTx(row.id);
    toast("Gagal mencatat: " + (err.message || err));
  }
}

function deleteTx(tRow) {
  const idx = state.transactions.findIndex(x => x.id === tRow.id);
  if (idx < 0) return;
  const copy = state.transactions[idx];
  state.transactions.splice(idx, 1);
  saveLocal();
  render();
  let undone = false;
  toast(t("toast_tx_deleted"), {
    label: t("toast_undo"),
    fn: () => {
      undone = true;
      state.transactions.push(copy);
      saveLocal();
      render();
    }
  });
  setTimeout(async () => {
    if (undone) return;
    try { await cloudWrite("transactions", "delete", copy, { id: copy.id }); }
    catch (err) { state.transactions.push(copy); saveLocal(); render(); toast("Gagal menghapus: " + (err.message || err)); }
  }, 6000);
}

function rollbackTx(id) {
  const i = state.transactions.findIndex(t => t.id === id);
  if (i >= 0) state.transactions.splice(i, 1);
  saveLocal();
  render();
}

        } else state.transactions.push(row);

        playChime(draft.type === "income" ? "coin" : "pop");
        close();
        render();
        try {
          if (isEdit) await cloudWrite("transactions", "update", row, { id: row.id });
          else await cloudWrite("transactions", "insert", row);
        } catch (err) {
          if (isEdit && prev) {
            const i = state.transactions.findIndex(t => t.id === row.id);
            if (i >= 0) state.transactions[i] = prev;
          } else rollbackTx(row.id);
          toast("Gagal menyimpan: " + (err.message || err));
        }
      }}),
    );
    setTimeout(() => amount.focus(), 60);
  });
}

function formatThousands(digits) {
  const s = String(digits || "").replace(/\D/g, "");
  if (!s) return "";
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function field(label, control) {
  const id = "f-" + uid();
  control.id = id;
  return el("label", { class: "field" }, [el("span", { text: label }), control]);
}

/* ---------- goals (wishlist & debt) ---------- */
function goalCard(g) {
  const card = el("div", { class: "card goal-card" });
  const head = el("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;" });
  head.append(
    el("strong", { style: "font-weight:700;", text: g.name }),
    el("span", { class: "tag " + (g.kind === "debt" ? "over" : "ok"), text: g.kind === "debt" ? t("goal_debt_badge") : t("goal_wish_badge") })
  );
  card.append(head);

  const bal = balance();
  const target = Number(g.amount);
  const progress = Math.max(0, Math.min(bal, target));
  const pct = target > 0 ? Math.min(100, Math.round(bal / target * 100)) : 0;
  const reached = bal >= target;

  if (g.due) card.append(el("div", { class: "small muted", text: (state.lang === "en" ? "Due " : "Tenggat ") + g.due }));
  card.append(el("div", { class: "muted small", style: "margin-bottom:8px;", text: t("goal_progress", { progress: rp(progress), target: rp(target) }) }));
  const track = el("div", { class: "bar-track", style: "margin-bottom:10px;" });
  track.append(el("div", { class: "bar-fill " + (g.kind === "debt" && g.status !== "done" ? "over" : "ok"), style: "width:" + Math.max(2, pct) + "%" }));
  card.append(track);

  if (g.status === "done") {
    card.append(el("span", { class: "tag ok", text: t("goal_done") }));
  } else {
    const btnRow = el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;" });
    btnRow.append(
      el("button", { type: "button", class: "btn btn-primary btn-sm", text: g.kind === "debt" ? t("goal_approve_debt") : t("goal_approve_wish"), onclick: () => approveGoal(g) }),
      el("button", { type: "button", class: "btn btn-sm", "aria-label": state.lang === "en" ? "Edit" : "Ubah", onclick: () => openGoalForm(g.kind, g) }, [icon("edit", 14)]),
      el("button", { type: "button", class: "btn btn-danger btn-sm", "aria-label": t("goal_delete"), onclick: () => deleteGoal(g) }, [icon("trash", 14)])
    );
    card.append(btnRow);
    if (reached) {
      card.append(el("div", { class: "small", style: "margin-top:8px;color:var(--ok);font-weight:600;", text: t("goal_reached") }));
    } else if (state.allowance?.enabled && Number(state.allowance.amount) > 0) {
      const remain = target - Math.max(0, bal);
      const days = Math.ceil(remain / Number(state.allowance.amount));
      if (days > 0 && days < 999) {
        card.append(el("div", { class: "small muted", style: "margin-top:8px;", text: t("goal_est_days", { days: String(days) }) }));
      }
    }
  }
  return card;
}

/* ---------- CSV ---------- */
function csvEscape(val) {
  const s = String(val == null ? "" : val);
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv() {
  const rows = [["date","type","category","amount","note"]];
  for (const t of [...state.transactions].sort((a, b) => a.date.localeCompare(b.date))) {
    const name = catById(t.category_id)?.name || "";
    rows.push([t.date, t.type, name, t.amount, t.note || ""]);
  }
  const body = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const bom = "\uFEFF";
  download(bom + body, `duitku-${localDate()}.csv`, "text/csv;charset=utf-8");
}
function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function pickFile(accept, cb) {
  const input = el("input", { type: "file", accept });
  input.onchange = () => {
    const file = input.files?.[0];
    if (file) cb(file);
  };
  input.click();
}

function parseCsv(text) {
  let s = text.replace(/^\uFEFF/, "");
  const firstLine = s.split(/\r\n|\n|\r/)[0] || "";
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += ch; i++;
    } else {
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delim) { row.push(field); field = ""; i++; continue; }
      if (ch === "\r" || ch === "\n") {
        row.push(field); field = "";
        if (ch === "\r" && s[i + 1] === "\n") i++;
        i++;
        if (row.some(x => x.trim().length)) rows.push(row);
        row = [];
        continue;
      }
      field += ch; i++;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    if (row.some(x => x.trim().length)) rows.push(row);
  }
  return { delim, rows };
}

function guessMap(headers) {
  const out = { date: -1, type: -1, category: -1, amount: -1, note: -1 };
  headers.forEach((h, idx) => {
    const norm = h.trim().toLowerCase();
    if (["date","tanggal","tgl"].includes(norm)) out.date = idx;
    else if (["type","jenis","tipe"].includes(norm)) out.type = idx;
    else if (["category","kategori","pos"].includes(norm)) out.category = idx;
    else if (["amount","jumlah","nominal","total","nilai"].includes(norm)) out.amount = idx;
    else if (["note","catatan","keterangan","deskripsi","memo"].includes(norm)) out.note = idx;
  });
  return out;
}

function parseAmount(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/^rp\.?\s*/i, "").trim();
  if (/^\d+$/.test(s)) return Number(s);
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, ""));
  if (/^\d{1,3}(,\d{3})+$/.test(s)) return Number(s.replace(/,/g, ""));
  return null;
}
function parseDateLoose(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const d = parseDate(s);
    return isNaN(d.getTime()) ? null : s;
  }
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const [_, d, mo, y] = m;
    const iso = `${y}-${pad(mo)}-${pad(d)}`;
    const dt = parseDate(iso);
    return isNaN(dt.getTime()) ? null : iso;
  }
  return null;
}
function parseTypeLoose(raw) {
  const s = String(raw || "").trim().toLowerCase();
  if (["income","pemasukan","masuk"].includes(s)) return "income";
  if (["expense","pengeluaran","keluar"].includes(s)) return "expense";
  return null;
}

function txSig(t) {
  const catName = (catById(t.category_id)?.name || t.category_name || "").toLowerCase();
  return [t.date, t.type, catName, Number(t.amount), (t.note || "").trim().toLowerCase()].join("|");
}

function startCsvImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { delim, rows } = parseCsv(String(reader.result));
      if (rows.length < 2) return toast("File CSV kosong atau tidak memiliki baris data.");
      reviewImport(rows);
    } catch (err) { toast("Gagal membaca CSV: " + err.message); }
  };
  reader.readAsText(file, "utf-8");
}
