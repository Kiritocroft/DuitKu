<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Duitku — Budget Tracker Mahasiswa</title>
<meta name="theme-color" content="#10b981">
<meta name="description" content="Aplikasi pencatat keuangan dan budget bulanan simpel untuk mahasiswa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --card-elevated: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-focus: #10b981;
  --accent: #059669;
  --accent-hover: #047857;
  --accent-soft: rgba(5, 150, 105, 0.1);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.12);
  --expense: #f43f5e;
  --expense-soft: rgba(244, 63, 94, 0.12);
  --balance: #6366f1;
  --balance-soft: rgba(99, 102, 241, 0.12);
  --budget: #0284c7;
  --budget-soft: rgba(2, 132, 199, 0.12);
  --ok: #10b981;
  --warn: #f59e0b;
  --over: #ef4444;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
  --radius: 18px;
  --radius-sm: 12px;
  --radius-pill: 9999px;
  --nav-h: 70px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090d16;
    --card: #111827;
    --card-hover: #172236;
    --card-elevated: #1e293b;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: #10b981;
    --accent: #10b981;
    --accent-hover: #34d399;
    --accent-soft: rgba(16, 185, 129, 0.15);
    --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
    --income: #34d399;
    --income-soft: rgba(52, 211, 153, 0.15);
    --expense: #fb7185;
    --expense-soft: rgba(251, 113, 133, 0.15);
    --balance: #818cf8;
    --balance-soft: rgba(129, 140, 248, 0.15);
    --budget: #38bdf8;
    --budget-soft: rgba(56, 189, 248, 0.15);
    --ok: #34d399;
    --warn: #fbbf24;
    --over: #f87171;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 16px 40px -4px rgba(0, 0, 0, 0.7);
    --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090d16;
  --card: #111827;
  --card-hover: #172236;
  --card-elevated: #1e293b;
  --text: #f8fafc;
  --text-muted: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: #10b981;
  --accent: #10b981;
  --accent-hover: #34d399;
  --accent-soft: rgba(16, 185, 129, 0.15);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #34d399;
  --income-soft: rgba(52, 211, 153, 0.15);
  --expense: #fb7185;
  --expense-soft: rgba(251, 113, 133, 0.15);
  --balance: #818cf8;
  --balance-soft: rgba(129, 140, 248, 0.15);
  --budget: #38bdf8;
  --budget-soft: rgba(56, 189, 248, 0.15);
  --ok: #34d399;
  --warn: #fbbf24;
  --over: #f87171;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 16px 40px -4px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.25);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --card-elevated: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --border-focus: #059669;
  --accent: #059669;
  --accent-hover: #047857;
  --accent-soft: rgba(5, 150, 105, 0.1);
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --income: #10b981;
  --income-soft: rgba(16, 185, 129, 0.12);
  --expense: #f43f5e;
  --expense-soft: rgba(244, 63, 94, 0.12);
  --balance: #6366f1;
  --balance-soft: rgba(99, 102, 241, 0.12);
  --budget: #0284c7;
  --budget-soft: rgba(2, 132, 199, 0.12);
  --ok: #10b981;
  --warn: #f59e0b;
  --over: #ef4444;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -1px rgba(15, 23, 42, 0.03);
  --shadow-lg: 0 16px 36px -4px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 8px 24px -4px rgba(16, 185, 129, 0.35);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body {
  width: 100%;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 16px calc(var(--nav-h) + 32px);
}
header.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0 16px;
  width: 100%;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: var(--shadow-glow);
  flex-shrink: 0;
}
.brand-title {
  font-size: 1.25rem;
  font-weight: 850;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
.sync {
  font-size: 0.75rem;
  min-height: 1.2em;
  margin-top: 3px;
}
.sync-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.sync-dot.online { background: var(--income); box-shadow: 0 0 6px var(--income); }
.sync-dot.saving { background: var(--warn); }
.sync-dot.offline { background: var(--text-muted); }
.sync-dot.local { background: var(--budget); }

.banner {
  background: var(--accent-soft);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  width: 100%;
}
.card-title {
  font-size: 1rem;
  font-weight: 750;
  letter-spacing: -0.01em;
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-subtitle {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* Dashboard Two-Column Grid on Desktop */
.dash-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  width: 100%;
}
@media (min-width: 900px) {
  .dash-layout {
    grid-template-columns: 1.15fr 0.85fr;
    gap: 20px;
    align-items: start;
  }
}
.dash-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  min-width: 0;
}

/* Month Navigation */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  margin-bottom: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  width: 100%;
}
.month-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  font-weight: 750;
}
.nav-arrow {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.nav-arrow:hover {
  background: var(--card-hover);
  border-color: var(--accent);
  color: var(--accent);
}

/* Hero Highlight Card */
.hero-card {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(6, 182, 212, 0.05) 100%);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  width: 100%;
}
.hero-card.over-budget {
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.12) 0%, rgba(239, 68, 68, 0.05) 100%);
  border-color: rgba(244, 63, 94, 0.35);
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  width: 100%;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  min-width: 0;
}
.hero-card.over-budget .hero-badge { color: var(--over); }
.hero-days {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.hero-amount {
  font-size: 1.85rem;
  font-weight: 850;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  line-height: 1.15;
  word-break: break-all;
}
.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  max-width: 100%;
}

/* 4-Stat Grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
  width: 100%;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.stat-icon.income { background: var(--income-soft); color: var(--income); }
.stat-icon.expense { background: var(--expense-soft); color: var(--expense); }
.stat-icon.balance { background: var(--balance-soft); color: var(--balance); }
.stat-icon.budget { background: var(--budget-soft); color: var(--budget); }
.stat-val {
  font-size: 1.15rem;
  font-weight: 750;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-val.income { color: var(--income); }
.stat-val.expense { color: var(--expense); }

/* Category Bars */
.cat-bar-item { margin-bottom: 12px; }
.cat-bar-item:last-child { margin-bottom: 0; }
.cat-bar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  font-size: 0.88rem;
}
.cat-bar-name {
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.cat-bar-badge {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent);
  flex-shrink: 0;
}
.cat-bar-amount {
  font-weight: 700;
  white-space: nowrap;
  margin-left: 8px;
}
.bar-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  width: 100%;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.3s ease;
}

/* Trend Chart */
.legend {
  display: flex;
  gap: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.legend-dot.income { background: var(--income); }
.legend-dot.expense { background: var(--expense); }

/* Smart Insights */
.insight-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 0.88rem;
  line-height: 1.45;
}
.insight-item:last-child { margin-bottom: 0; }
.insight-icon {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 38px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--card);
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.chip svg { color: var(--accent); }
.chip-amount {
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 1px 6px;
  border-radius: 99px;
  font-size: 0.75rem;
}

/* Transaction List */
.tx-group { padding: 0; margin-bottom: 12px; width: 100%; }
.tx-group-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: var(--card-hover);
  border-bottom: 1px solid var(--border);
}
.tx-group-date {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 700;
}
.tx-group-total {
  font-size: 0.82rem;
  font-weight: 700;
}
.tx-group-total.income { color: var(--income); }
.tx-group-total.expense { color: var(--expense); }
.tx-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.tx-row:last-child { border-bottom: 0; }
.tx-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.tx-avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tx-avatar.income { background: var(--income-soft); color: var(--income); }
.tx-avatar.expense { background: var(--expense-soft); color: var(--expense); }
.tx-info { min-width: 0; flex: 1; }
.tx-name { font-weight: 650; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-note { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amount { font-weight: 750; font-size: 0.95rem; }
.tx-amount.income { color: var(--income); }
.tx-amount.expense { color: var(--expense); }
.tx-actions { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }

/* Budget Items */
.budget-item-card { margin-bottom: 12px; width: 100%; }
.budget-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.budget-cat-name { font-size: 1rem; font-weight: 700; }
.budget-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 500;
}
.budget-remain { font-weight: 700; }
.budget-remain.ok { color: var(--ok); }
.budget-remain.warn { color: var(--warn); }
.budget-remain.over { color: var(--over); }
.budget-inline-edit {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.budget-inline-edit input {
  max-width: 160px;
  height: 36px;
  padding: 4px 10px;
}
.budget-copy-card {
  background: var(--accent-soft);
  border-color: var(--accent);
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-muted);
}
.empty-icon { font-size: 2.5rem; margin-bottom: 8px; }
.empty-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 12px; color: var(--text); }

/* Buttons & Inputs */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.15s ease;
}
.btn:hover { background: var(--card-hover); border-color: var(--text-muted); }
.btn-primary {
  background: var(--accent-gradient);
  color: #fff;
  border-color: transparent;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover {
  filter: brightness(1.05);
  background: var(--accent-gradient);
  border-color: transparent;
}
.btn-danger {
  background: transparent;
  color: var(--over);
  border-color: var(--over);
}
.btn-danger:hover {
  background: var(--expense-soft);
}
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--card-hover); }
.btn-ghost.danger { color: var(--over); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 0.82rem; }
.btn-xs { min-height: 24px; padding: 0 8px; font-size: 0.72rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); font-weight: 600; }
.btn-link { background: transparent; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
.btn-icon-subtle {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
}
.btn-icon-subtle:hover { background: var(--card-hover); color: var(--text); }
.btn-icon-subtle.danger:hover { background: var(--expense-soft); color: var(--over); }

label.field { display: block; margin-bottom: 12px; width: 100%; }
label.field span { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"],
input[type="search"], select, textarea {
  width: 100%;
  min-height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  padding: 8px 12px;
  font-size: 0.95rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}

.grid { display: grid; gap: 10px; width: 100%; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.full-width { width: 100%; }

/* Segmented Control */
.seg {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  width: 100%;
}
.seg button {
  flex: 1;
  min-height: 36px;
  border-radius: 8px;
  border: 0;
  background: transparent;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: all 0.15s ease;
}
.seg button[aria-pressed="true"] {
  background: var(--card);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Tags */
.tag {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tag.ok { background: var(--income-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.over { background: var(--expense-soft); color: var(--over); }
.tag.muted-tag { background: var(--border); color: var(--text-muted); }

.nav-catat-btn {
  display: none;
}

/* Floating Action Button */
.fab {
  position: fixed;
  right: 20px;
  bottom: calc(var(--nav-h) + 16px);
  z-index: 25;
  min-height: 50px;
  padding: 0 20px;
  border-radius: var(--radius-pill);
  border: 0;
  background: var(--accent-gradient);
  color: #fff;
  font-weight: 750;
  font-size: 0.95rem;
  box-shadow: var(--shadow-glow), 0 4px 16px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
}
.fab:hover { transform: translateY(-2px) scale(1.02); }
.fab:active { transform: translateY(0) scale(0.98); }

/* Navigation Dock (Mobile Bottom Bar) */
.nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: var(--nav-h);
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 30;
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
}
.nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.nav button[aria-current="page"] {
  color: var(--accent);
  font-weight: 750;
}
.nav button[aria-current="page"] svg {
  transform: translateY(-2px);
  filter: drop-shadow(0 2px 6px var(--accent-soft));
}

/* Modal & Sheet */
.modal-back {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.15s ease;
}
.sheet {
  background: var(--card);
  width: min(540px, 100%);
  max-height: 90dvh;
  overflow-y: auto;
  border-radius: 24px 24px 0 0;
  padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 99px;
  background: var(--border);
  margin: 0 auto 12px;
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.rotate-45 { transform: rotate(45deg); }

/* Amount Hero Input */
.amount-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  margin-bottom: 16px;
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.amount-hero .rp-prefix {
  font-size: 1.35rem;
  font-weight: 850;
  color: var(--accent);
}
.amount-hero input {
  font-size: 2rem;
  font-weight: 850;
  text-align: center;
  border: 0;
  background: transparent;
  width: 100%;
  outline: none;
  color: var(--text);
}

/* Auth View */
.auth-wrap {
  min-height: calc(100dvh - 140px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 0;
  width: 100%;
}
.auth-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 32px 24px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 440px;
}
.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}
.brand-badge {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  background: var(--accent-gradient);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: var(--shadow-glow);
  margin-bottom: 12px;
}
.auth-title {
  font-size: 1.45rem;
  font-weight: 850;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.auth-sub {
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.4;
}

/* Toast Heads-Up */
.toast-wrap {
  position: fixed;
  bottom: calc(var(--nav-h) + 16px);
  left: 16px;
  right: 16px;
  z-index: 99;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius-pill);
  padding: 10px 18px;
  display: inline-flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  box-shadow: var(--shadow-lg);
  font-size: 0.88rem;
  font-weight: 600;
  animation: fadeInDown 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: min(440px, 100%);
}

/* Desktop Responsiveness */
@media (min-width: 900px) {
  .app {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 32px;
    padding: 32px 40px;
  }
  header.top {
    grid-column: 1 / -1;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  #banner {
    grid-column: 1 / -1;
  }
  .nav {
    position: sticky;
    top: 32px;
    height: auto;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow-sm);
    background: var(--card);
  }
  .nav button {
    flex-direction: row;
    justify-content: flex-start;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    gap: 12px;
    font-size: 0.95rem;
    width: 100%;
  }
  .nav button[aria-current="page"] {
    background: var(--accent-soft);
  }
  .nav button[aria-current="page"] svg {
    transform: none;
  }
  main#main {
    min-width: 0;
    width: 100%;
  }
  .nav-catat-btn {
    display: inline-flex;
    margin-top: 16px;
    width: 100%;
    min-height: 46px;
    border-radius: var(--radius-sm);
    font-weight: 750;
    font-size: 0.95rem;
  }
  .fab { display: none !important; }
  .toast-wrap { top: 24px; bottom: auto; }
  .modal-back { align-items: center; }
  .sheet { border-radius: 24px; }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-icon" id="brandLogo"></div>
      <div>
        <div class="brand-title">Duitku</div>
        <div class="sync" id="syncStatus" aria-live="polite"></div>
      </div>
    </div>
    <div id="headerExtra"></div>
  </header>
  <div id="banner"></div>
  <nav class="nav" id="mainNav" aria-label="Navigasi utama">
    <button type="button" data-screen="dashboard" aria-label="Dashboard">
      <span class="nav-icon" id="navIcon-dashboard"></span>

</div>

</button>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>
<script>
(() => {
"use strict";

const ICONS = {
  dashboard: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  transaksi: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8H8"/><path d="M16 12H8"/><path d="M12 16H8"/>',
  budget: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  lainnya: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',

  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  lightning: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',
  search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>',
  walletLogo: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/><circle cx="16" cy="15" r="1.5"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
};

function icon(name, size = 18, cls = "") {
  const svgNS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(svgNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("width", String(size));
  s.setAttribute("height", String(size));
  s.setAttribute("fill", "none");
  s.setAttribute("stroke", "currentColor");
  s.setAttribute("stroke-width", "2");
  s.setAttribute("stroke-linecap", "round");
  s.setAttribute("stroke-linejoin", "round");
  s.setAttribute("aria-hidden", "true");
  if (cls) s.setAttribute("class", cls);
  const raw = ICONS[name];
  if (raw) {
    const parser = new DOMParser();
    const doc = parser.parseFromString('<svg xmlns="http://www.w3.org/2000/svg">' + raw + '</svg>', "image/svg+xml");
    while (doc.documentElement.firstChild) {
      s.appendChild(doc.documentElement.firstChild);
    }
  }
  return s;
}

const DEFAULT_EXPENSE = ["Makan","Jajan","Transport","Kos","Pulsa/Internet","Tugas/Print","Hiburan","Lainnya"];
const DEFAULT_INCOME = ["Uang Saku","Gaji/Freelance","Beasiswa","Lainnya"];
const PAGE = 50;

const state = {
  mode: "local",
  user: null,
  categories: [],
  transactions: [],
  budgets: [],
  screen: "dashboard",
  month: monthKey(new Date()),
  txFilter: { month: "", category: "", type: "", q: "" },
  txShown: PAGE,
  sync: "lokal",
  online: navigator.onLine,
  pending: [],
  sb: null,
  channel: null,
  writing: new Set(),
};

const $ = (sel, root = document) => root.querySelector(sel);
const main = $("#main");

function pad(n) { return String(n).padStart(2, "0"); }
function localDate(d = new Date()) {
  const y = d.getFullYear(), m = pad(d.getMonth() + 1), day = pad(d.getDate());
  return `${y}-${m}-${day}`;
}
function monthKey(d = new Date()) {
  if (typeof d === "string") return d.slice(0, 7);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addMonths(key, delta) {
  const [y, m] = key.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return monthKey(d);
}
function daysInMonth(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function daysLeftInMonth(key) {
  const today = localDate();
  if (monthKey(today) !== key) return 0;
  const now = parseDate(today);
  const total = daysInMonth(key);
  return Math.max(0, total - now.getDate());
}
function uid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
function nowIso() { return new Date().toISOString(); }

const nfId = new Intl.NumberFormat("id-ID");
function rp(n) {
  const v = Math.round(Number(n) || 0);
  return "Rp " + nfId.format(v);
}
function compact(n) {
  const num = Math.abs(Number(n) || 0);
  if (num >= 1000000) {
    const v = (num / 1000000).toFixed(1).replace(".0", "").replace(".", ",");
    return v + "jt";
  }
  if (num >= 1000) {
    const v = Math.round(num / 1000);
    return v + "rb";
  }
  return String(num);
}
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Ags","Sep","Okt","Nov","Des"];
function monthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return `${MONTH_NAMES[m - 1]} ${y}`;
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (k === "style") node.setAttribute("style", v);
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    node.append(c.nodeType ? c : String(c));
  }
  return node;
}
function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function toast(msg, action) {
  const wrap = $("#toasts");
  const t = el("div", { class: "toast", role: "status" }, [
    el("span", { text: msg }),
    action ? el("button", {
      type: "button", class: "btn-link", text: action.label,
      onclick: () => { action.fn(); t.remove(); },
      style: "color:#10b981;font-weight:700;margin-left:8px;"
    }) : null
  ]);
  wrap.append(t);
  setTimeout(() => t.remove(), 4000);
}

function setSync(text, dotClass = "") {
  state.sync = text;
  const host = $("#syncStatus");
  if (!host) return;
  clear(host);
  if (!text) return;
  const pill = el("span", { class: "sync-pill" });
  const dot = el("span", { class: "sync-dot " + (dotClass || (text === "Tersinkron" ? "online" : text === "Menyimpan..." ? "saving" : text === "Offline" ? "offline" : "local")) });
  pill.append(dot, text);
  host.append(pill);
}

/* ---------- persistence ---------- */
const STORAGE_PREFIX = "duitku.";
function loadLocal() {
  try {
    const c = localStorage.getItem(STORAGE_PREFIX + "categories");
    const t = localStorage.getItem(STORAGE_PREFIX + "transactions");
    const b = localStorage.getItem(STORAGE_PREFIX + "budgets");
    state.categories = c ? JSON.parse(c) : [];
    state.transactions = t ? JSON.parse(t) : [];
    state.budgets = b ? JSON.parse(b) : [];
    seedIfEmpty();
  } catch (err) {
    seedIfEmpty();
  }
}
function saveLocal() {
  try {
    localStorage.setItem(STORAGE_PREFIX + "categories", JSON.stringify(state.categories));
    localStorage.setItem(STORAGE_PREFIX + "transactions", JSON.stringify(state.transactions));
    localStorage.setItem(STORAGE_PREFIX + "budgets", JSON.stringify(state.budgets));
  } catch (err) {}
}

function catById(id) {
  return state.categories.find(c => c.id === id);
}
function activeCats(type) {
  return state.categories.filter(c => !c.archived && (!type || c.type === type))
    .sort((a, b) => a.sort_order - b.sort_order || a.name.localeCompare(b.name));
}
function seedIfEmpty() {
  if (state.categories.length) return;
  let order = 0;
  for (const name of DEFAULT_EXPENSE) {
    state.categories.push({ id: uid(), name, type: "expense", archived: false, sort_order: order++ });
  }
  for (const name of DEFAULT_INCOME) {
    state.categories.push({ id: uid(), name, type: "income", archived: false, sort_order: order++ });
  }
}

/* ---------- supabase ---------- */
function cfg() {
  return window.APP_CONFIG || {};
}
async function initBackend() {
  const { SUPABASE_URL, SUPABASE_ANON_KEY } = cfg();
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) {
    enterLocal("Mode lokal: data hanya tersimpan di perangkat ini");
    return;
  }
  try {
    state.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });
    const { data: { session } } = await state.sb.auth.getSession();
    state.mode = "cloud";
    if (session?.user) {
      state.user = session.user;
      await bootCloud();
    } else {
      renderAuth();
    }
    state.sb.auth.onAuthStateChange(async (event, sess) => {
      if (sess?.user) {
        state.user = sess.user;
        await bootCloud();
      } else {
        state.user = null;
        teardownRealtime();
        renderAuth();
      }
    });
  } catch (err) {
    enterLocal("Mode lokal: tidak dapat terhubung ke Supabase");
  }
}

function enterLocal(msg) {
  state.mode = "local";
  state.user = null;
  loadLocal();
  showBanner(msg || "Mode lokal: data hanya tersimpan di perangkat ini");
  setSync("Mode lokal", "local");
  $("#mainNav").style.display = "";
  render();
}

function showBanner(text, action) {
  const b = $("#banner");
  clear(b);
  if (!text) return;
  const wrap = el("div", { class: "banner" });
  wrap.append(el("span", { text }));
  if (action) {
    wrap.append(el("button", {
      type: "button", class: "btn btn-sm btn-primary", text: action.label,
      onclick: () => { action.fn(); clear(b); }
    }));
  }
  b.append(wrap);
}

function authMsg(err) {
  const m = (err?.message || String(err)).toLowerCase();
  if (m.includes("invalid login credentials")) return "Email atau kata sandi salah.";
  if (m.includes("user already registered")) return "Email sudah terdaftar. Silakan masuk.";
  if (m.includes("password should be at least")) return "Kata sandi minimal 6 karakter.";
  if (m.includes("rate limit")) return "Terlalu banyak percobaan. Coba beberapa saat lagi.";
  return err.message || "Terjadi kesalahan. Coba lagi.";
}

async function bootCloud() {
  setSync("Menyimpan...", "saving");
  showBanner("");
  await loadAllCloud();
  subscribeRealtime();
  await offerUpload();
  setSync("Tersinkron", "online");
  $("#mainNav").style.display = "";
  render();
}

async function pageAll(table, select = "*", orderCol = "created_at", ascending = true) {
  const PAGE_SZ = 1000;
  let from = 0;
  const all = [];
  while (true) {
    const { data, error } = await state.sb
      .from(table)
      .select(select)
      .order(orderCol, { ascending })
      .range(from, from + PAGE_SZ - 1);
    if (error) throw error;
    all.push(...(data || []));
    if (!data || data.length < PAGE_SZ) break;
    from += PAGE_SZ;
  }
  return all;
}

async function loadAllCloud() {
  try {
    const [cats, txs, buds] = await Promise.all([
      pageAll("categories", "*", "sort_order", true),
      pageAll("transactions", "*", "date", false),
      pageAll("budgets", "*", "month", true),
    ]);
    state.categories = cats;
    state.transactions = txs;
    state.budgets = buds;
    if (!cats.length) await pushSeedCategories();
    saveLocal();
  } catch (err) {
    toast("Gagal memuat dari cloud: " + (err.message || err));
  }
}

async function pushSeedCategories() {
  seedIfEmpty();
  const rows = state.categories.map(c => ({
    id: c.id, name: c.name, type: c.type, archived: c.archived, sort_order: c.sort_order, user_id: state.user.id
  }));
  const { error } = await state.sb.from("categories").insert(rows);
  if (error) toast("Gagal membuat kategori bawaan: " + error.message);
}

async function offerUpload() {
  let localTxs = [];
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + "transactions");
    localTxs = raw ? JSON.parse(raw) : [];
  } catch {}
  if (localTxs.length && !state.transactions.length) {
    showBanner("Ada data lokal di perangkat ini. Upload ke akun cloud?", {
      label: "Upload data lokal",
      fn: () => uploadAllLocal(),
    });
  }
}

async function uploadAllLocal() {
  setSync("Menyimpan...", "saving");
  try {
    const c = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "categories") || "[]");
    const t = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "transactions") || "[]");
    const b = JSON.parse(localStorage.getItem(STORAGE_PREFIX + "budgets") || "[]");
    if (c.length) {
      await state.sb.from("categories").upsert(c.map(x => ({ ...x, user_id: state.user.id })), { onConflict: "id" });
    }
    if (t.length) await insertChunked("transactions", t.map(x => ({ ...x, user_id: state.user.id })));
    if (b.length) {
      await state.sb.from("budgets").upsert(b.map(x => ({ ...x, user_id: state.user.id })), { onConflict: "user_id,month,category_id" });
    }
    toast("Data lokal berhasil di-upload.");
    await loadAllCloud();
    render();
  } catch (err) {
    toast("Gagal upload data: " + (err.message || err));
  } finally {
    setSync("Tersinkron", "online");
  }
}

async function insertChunked(table, rows) {
  const CHUNK = 500;
  for (let i = 0; i < rows.length; i += CHUNK) {
    const slice = rows.slice(i, i + CHUNK);
    const { error } = await state.sb.from(table).insert(slice);
    if (error) throw error;
  }
}

function subscribeRealtime() {
  teardownRealtime();
  if (!state.sb || !state.user) return;
  state.channel = state.sb
    .channel("duitku-sync")
    .on("postgres_changes", { event: "*", schema: "public", table: "transactions" }, p => applyChange("transactions", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "categories" }, p => applyChange("categories", p))
    .on("postgres_changes", { event: "*", schema: "public", table: "budgets" }, p => applyChange("budgets", p))
    .subscribe();
}

function teardownRealtime() {
  if (state.channel && state.sb) {
    state.sb.removeChannel(state.channel);
    state.channel = null;
  }
}

function applyChange(table, payload) {
  const { eventType, new: n, old: o } = payload;
  const target = state[table];
  if (!target) return;
  const key = rowKey(table, n || o);
  if (state.writing.has(key)) return;

  if (eventType === "INSERT") {
    if (!target.some(x => sameRow(table, x, n))) target.push(n);
  } else if (eventType === "UPDATE") {
    const i = target.findIndex(x => sameRow(table, x, n));
    if (i >= 0) {
      if ((n.updated_at || "") >= (target[i].updated_at || "")) target[i] = n;
    } else target.push(n);
  } else if (eventType === "DELETE") {
    const i = target.findIndex(x => sameRow(table, x, o));
    if (i >= 0) target.splice(i, 1);
  }
  saveLocal();
  render();
}

function rowKey(table, r) {
  if (!r) return "";
  if (table === "budgets") return `budgets:${r.month}:${r.category_id}`;
  return `${table}:${r.id}`;
}
function sameRow(table, a, b) {
  if (!a || !b) return false;
  if (table === "budgets") return a.month === b.month && a.category_id === b.category_id;
  return a.id === b.id;
}

async function cloudWrite(table, op, row, match) {
  if (state.mode !== "cloud") return;
  const key = rowKey(table, row || match);
  state.writing.add(key);
  setSync("Menyimpan...", "saving");
  try {
    if (!state.online) {
      state.pending.push({ table, op, row, match });
      setSync("Offline", "offline");
      return;
    }
    const t = state.sb.from(table);
    let res;
    if (op === "insert") res = await t.insert({ ...strip(row), user_id: state.user.id });
    else if (op === "update") res = await t.update(strip(row)).match(match);
    else if (op === "upsert") res = await t.upsert({ ...strip(row), user_id: state.user.id });
    else if (op === "delete") res = await t.delete().match(match);
    if (res?.error) throw res.error;
    setSync("Tersinkron", "online");
  } catch (err) {
    setSync("Offline", "offline");
    state.pending.push({ table, op, row, match });
    throw err;
  } finally {
    setTimeout(() => state.writing.delete(key), 800);
  }
}
function strip(r) {
  const o = { ...r };
  delete o.user_id;
  return o;
}

window.addEventListener("online", () => {
  state.online = true;
  setSync("Tersinkron", "online");
  flushQueue();
  if (state.mode === "cloud" && state.user) loadAllCloud().then(render);
});
window.addEventListener("offline", () => {
  state.online = false;
  setSync("Offline", "offline");
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.mode === "cloud" && state.user && state.online) {
    loadAllCloud().then(render);
  }
});

async function flushQueue() {
  if (!state.pending.length || !state.sb || !state.online) return;
  setSync("Menyimpan...", "saving");
  const q = [...state.pending];
  state.pending = [];
  for (const item of q) {
    try {
      await cloudWrite(item.table, item.op, item.row, item.match);
    } catch {
      state.pending.push(item);
      break;
    }
  }
  setSync(state.pending.length ? "Offline" : "Tersinkron", state.pending.length ? "offline" : "online");
}

/* ---------- aggregates ---------- */
function txInMonth(key) {
  return state.transactions.filter(t => t.date.slice(0, 7) === key);
}
function sumType(list, type) {
  return list.filter(t => t.type === type).reduce((s, t) => s + Number(t.amount || 0), 0);
}
function spentByCat(key) {
  const map = new Map();
  for (const t of txInMonth(key)) {
    if (t.type !== "expense") continue;
    map.set(t.category_id, (map.get(t.category_id) || 0) + Number(t.amount || 0));
  }
  return map;
}
function budgetsFor(key) {
  return state.budgets.filter(b => b.month === key);
}

/* ---------- navigation & rendering ---------- */
function render() {
  document.querySelectorAll(".nav button").forEach(b => {
    if (b.id === "desktopCatatBtn") return;
    b.setAttribute("aria-current", b.dataset.screen === state.screen ? "page" : "false");
  });
  $("#fabCatat").hidden = state.screen === "lainnya" || (state.mode === "cloud" && !state.user);
  const deskBtn = $("#desktopCatatBtn");
  if (deskBtn) deskBtn.hidden = state.screen === "lainnya" || (state.mode === "cloud" && !state.user);
  clear(main);
  if (state.mode === "cloud" && !state.user) {
    renderAuth();
    return;
  }
  if (state.screen === "dashboard") renderDashboard();
  else if (state.screen === "transaksi") renderTransaksi();
  else if (state.screen === "budget") renderBudget();
  else renderSettings();

  const syncEl = $("#syncStatus");
  if (syncEl && !syncEl.textContent) {
    setSync(state.mode === "local" ? "Mode lokal" : state.sync, state.mode === "local" ? "local" : "");
  }
}

document.querySelector(".nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  state.screen = b.dataset.screen;
  render();
});
$("#fabCatat").addEventListener("click", () => openTxForm());

/* ---------- month navigation helper ---------- */
function monthNavEl(key) {
  const currentKey = monthKey(new Date());
  const head = el("div", { class: "month-nav" }, [
    el("button", { type: "button", class: "icon-btn nav-arrow", "aria-label": "Bulan sebelumnya", onclick: () => { state.month = addMonths(key, -1); render(); } }, [icon("chevronLeft", 18)]),
    el("div", { class: "month-title" }, [
      icon("calendar", 16, "muted"),
      el("strong", { text: monthLabel(key) }),
      key !== currentKey ? el("button", { type: "button", class: "btn-xs", text: "Bulan Ini", onclick: () => { state.month = currentKey; render(); } }) : null
    ]),
    el("button", { type: "button", class: "icon-btn nav-arrow", "aria-label": "Bulan berikutnya", onclick: () => { state.month = addMonths(key, 1); render(); } }, [icon("chevronRight", 18)]),
  ]);
  return head;
}

/* ---------- dashboard ---------- */
function renderDashboard() {
  const key = state.month;
  const list = txInMonth(key);
  const income = sumType(list, "income");
  const expense = sumType(list, "expense");
  const budgets = budgetsFor(key);
  const budgetTotal = budgets.reduce((s, b) => s + Number(b.amount), 0);
  const spentMap = spentByCat(key);
  const remain = budgets.length ? budgetTotal - expense : null;

  main.append(monthNavEl(key));

  const layout = el("div", { class: "dash-layout" });
  const colLeft = el("div", { class: "dash-col" });
  const colRight = el("div", { class: "dash-col" });

  if (budgets.length && remain != null) {
    const left = daysLeftInMonth(key);
    const over = remain < 0;
    const hero = el("div", { class: "hero-card" + (over ? " over-budget" : "") });
    const top = el("div", { class: "hero-top" });
    top.append(
      el("div", { class: "hero-badge" }, [
        icon(over ? "arrowUpRight" : "wallet", 14),
        el("span", { text: over ? "Melebihi Budget" : "Sisa Budget Bulan Ini" })
      ]),
      left > 0 ? el("span", { class: "hero-days", text: left + " hari lagi" }) : null
    );
    hero.append(top);
    hero.append(el("div", { class: "hero-amount", text: (over ? "-" : "") + rp(Math.abs(remain)) }));
    let pillText = "";
    if (over) {
      pillText = "Bulan ini sudah melebihi budget sebesar " + rp(Math.abs(remain));
    } else if (left > 0) {
      pillText = "Boleh jajan sekitar " + rp(Math.floor(remain / left)) + " / hari";
    } else {
      pillText = "Sisa budget bulan ini " + rp(remain);
    }
    hero.append(el("div", { class: "hero-pill" }, [
      icon(over ? "bulb" : "lightning", 14),
      el("span", { text: pillText })
    ]));
    colLeft.append(hero);
  }

  const stats = el("div", { class: "stats-grid" });
  const cards = [
    { label: "Pemasukan", val: rp(income), icon: "arrowDownLeft", cls: "income" },
    { label: "Pengeluaran", val: rp(expense), icon: "arrowUpRight", cls: "expense" },
    { label: "Selisih", val: (income - expense >= 0 ? "+" : "-") + rp(Math.abs(income - expense)), icon: "scale", cls: "balance" },
    { label: "Sisa Budget Total", val: budgets.length ? (budgetTotal - expense >= 0 ? "" : "-") + rp(Math.abs(budgetTotal - expense)) : "Belum diatur", icon: "target", cls: "budget" }
  ];
  for (const c of cards) {
    const card = el("div", { class: "stat-card" });
    const top = el("div", { class: "stat-top" });
    top.append(el("span", { class: "stat-label", text: c.label }));
    top.append(el("span", { class: "stat-icon " + c.cls }, [icon(c.icon, 16)]));
    card.append(top);
    card.append(el("div", { class: "stat-val " + (c.cls === "income" || c.cls === "expense" ? c.cls : ""), text: c.val }));
    stats.append(card);
  }
  colLeft.append(stats);
  colLeft.append(trendCard(key));

  const byCat = [...spentMap.entries()].map(([id, amount]) => ({ id, amount, name: catById(id)?.name || "Tanpa kategori" }))
    .sort((a, b) => b.amount - a.amount);
  const catCard = el("div", { class: "card" });
  catCard.append(el("h2", { class: "card-title", text: "Pengeluaran per Kategori" }));
  if (!byCat.length) {
    catCard.append(el("div", { class: "empty-state" }, [
      el("div", { class: "empty-icon", text: "🍜" }),
      el("p", { class: "empty-title", text: "Masih bersih! Belum ada pengeluaran bulan ini." }),
      el("button", { type: "button", class: "btn btn-primary btn-sm", text: "+ Catat Pengeluaran", onclick: () => openTxForm({ type: "expense" }) }),
    ]));
  } else {
    for (const c of byCat) {
      const pct = expense ? Math.round(c.amount / expense * 100) : 0;
      const row = el("div", { class: "cat-bar-item" });
      const top = el("div", { class: "cat-bar-header" });
      const nameWrap = el("div", { class: "cat-bar-name" });
      nameWrap.append(el("span", { text: c.name }), el("span", { class: "cat-bar-badge", text: pct + "%" }));
      top.append(nameWrap, el("span", { class: "cat-bar-amount", text: rp(c.amount) }));
      row.append(top);
      const track = el("div", { class: "bar-track" });
      track.append(el("div", { class: "bar-fill", style: "width:" + Math.max(2, pct) + "%;background:var(--accent)" }));
      row.append(track);
      catCard.append(row);
    }
  }
  colRight.append(catCard);
  colRight.append(insightsCard(key, income, expense, budgets, spentMap, remain));

  layout.append(colLeft, colRight);
  main.append(layout);
}

function trendCard(key) {
  const months = [];
  for (let i = 5; i >= 0; i--) months.push(addMonths(key, -i));
  const series = months.map(m => {
    const list = txInMonth(m);
    return { m, income: sumType(list, "income"), expense: sumType(list, "expense") };
  });
  const allVals = series.flatMap(s => [s.income, s.expense]);
  const hasData = allVals.some(v => v > 0);
  const max = Math.max(1, ...allVals);

  const card = el("div", { class: "card" });
  const head = el("div", { style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;" });
  head.append(el("h2", { class: "card-title", style: "margin:0;", text: "Tren 6 Bulan Terakhir" }));

  const legend = el("div", { class: "legend" }, [
    el("span", { class: "legend-item" }, [el("span", { class: "legend-dot income" }), el("span", { text: "Pemasukan" })]),
    el("span", { class: "legend-item" }, [el("span", { class: "legend-dot expense" }), el("span", { text: "Pengeluaran" })]),
  ]);
  head.append(legend);
  card.append(head);

  const W = 360, H = 160, pad = 36;
  const gw = (W - pad) / series.length;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + (H + 30));
  svg.setAttribute("width", "100%");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", "Grafik pemasukan dan pengeluaran 6 bulan");

  for (const yFrac of [0.25, 0.5, 0.75, 1.0]) {
    const yPos = H - (H - 24) * yFrac;
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", pad - 8); line.setAttribute("y1", yPos);
    line.setAttribute("x2", W); line.setAttribute("y2", yPos);
    line.setAttribute("stroke", "var(--border)");
    line.setAttribute("stroke-dasharray", "3,3");
    line.setAttribute("stroke-width", "1");
    svg.append(line);
  }

  function bar(x, amount, color, label) {
    const h = hasData && amount > 0 ? Math.max(4, (amount / max) * (H - 24)) : 0;
    const r = document.createElementNS(svgNS, "rect");
    r.setAttribute("x", x);
    r.setAttribute("y", H - h);
    r.setAttribute("width", 14);
    r.setAttribute("height", h);
    r.setAttribute("rx", 4);
    r.setAttribute("fill", color);
    r.setAttribute("tabindex", "0");
    r.setAttribute("role", "button");
    const tip = label + ": " + rp(amount);
    r.setAttribute("aria-label", tip);
    const title = document.createElementNS(svgNS, "title");
    title.textContent = tip;
    r.append(title);
    r.addEventListener("click", () => toast(tip));
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toast(tip); } });
    return r;
  }

  series.forEach((s, i) => {
    const x = pad + i * gw + (gw - 32) / 2;
    if (hasData) {
      svg.append(bar(x, s.income, "var(--income)", monthLabel(s.m) + " pemasukan"));
      svg.append(bar(x + 16, s.expense, "var(--expense)", monthLabel(s.m) + " pengeluaran"));
    } else {
      const r1 = document.createElementNS(svgNS, "rect");
      r1.setAttribute("x", x); r1.setAttribute("y", H - 20); r1.setAttribute("width", 14); r1.setAttribute("height", 20);
      r1.setAttribute("rx", 4); r1.setAttribute("fill", "var(--border)"); r1.setAttribute("opacity", "0.5");
      const r2 = document.createElementNS(svgNS, "rect");
      r2.setAttribute("x", x + 16); r2.setAttribute("y", H - 20); r2.setAttribute("width", 14); r2.setAttribute("height", 20);
      r2.setAttribute("rx", 4); r2.setAttribute("fill", "var(--border)"); r2.setAttribute("opacity", "0.3");
      svg.append(r1, r2);
    }
    const t = document.createElementNS(svgNS, "text");
    t.setAttribute("x", x + 15);
    t.setAttribute("y", H + 18);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("font-size", "11");
    t.setAttribute("font-weight", "500");
    t.setAttribute("fill", "var(--text-muted)");
    t.textContent = monthLabel(s.m).split(" ")[0].slice(0, 3);
    svg.append(t);
  });

  if (hasData) {
    const axis = document.createElementNS(svgNS, "text");
    axis.setAttribute("x", 2); axis.setAttribute("y", 14);
    axis.setAttribute("font-size", "10"); axis.setAttribute("font-weight", "600");
    axis.setAttribute("fill", "var(--text-muted)");
    axis.textContent = compact(max);
    svg.append(axis);
  } else {
    const emptyMsg = document.createElementNS(svgNS, "text");
    emptyMsg.setAttribute("x", W / 2); emptyMsg.setAttribute("y", H / 2);
    emptyMsg.setAttribute("text-anchor", "middle");
    emptyMsg.setAttribute("font-size", "12"); emptyMsg.setAttribute("fill", "var(--text-muted)");
    emptyMsg.textContent = "Grafik muncul setelah ada transaksi";
    svg.append(emptyMsg);
  }

  card.append(svg);
  return card;
}

function insightsCard(key, income, expense, budgets, spentMap, remain) {
  const insights = [];
  const prevKey = addMonths(key, -1);
  const prev = txInMonth(prevKey);
  const prevExp = sumType(prev, "expense");
  for (const b of budgets) {
    const spent = spentMap.get(b.category_id) || 0;
    if (b.amount > 0 && spent > b.amount) {
      const pct = Math.round((spent - b.amount) / b.amount * 100);
      const name = catById(b.category_id)?.name || "Kategori";
      insights.push({ score: pct, text: name + " " + pct + "% di atas budget" });
    }
  }
  if (prevExp > 0 && expense > 0) {
    const delta = Math.round((expense - prevExp) / prevExp * 100);
    if (delta <= -5) insights.push({ score: Math.abs(delta), text: "Pengeluaran bulan ini " + Math.abs(delta) + "% lebih rendah dari bulan lalu" });
    else if (delta >= 5) insights.push({ score: delta, text: "Pengeluaran bulan ini " + delta + "% lebih tinggi dari bulan lalu" });
  }
  const today = localDate();
  if (monthKey(today) === key && budgets.length && remain != null) {
    const day = parseDate(today).getDate();
    if (day >= 5) {
      const dim = daysInMonth(key);
      const projected = Math.round(expense / day * dim);
      const budgetTotal = budgets.reduce((s, b) => s + Number(b.amount), 0);
      const gap = budgetTotal - projected;
      if (gap > 0) insights.push({ score: 40, text: "Dengan kecepatan sekarang, bulan ini kamu akan lebih hemat sekitar " + rp(gap) + " dari budget" });
      else if (gap < 0) insights.push({ score: 50, text: "Dengan kecepatan sekarang, bulan ini kamu akan melebihi budget sekitar " + rp(Math.abs(gap)) });
    }
  }
  if (expense > 0) {
    let top = null;
    for (const [id, amount] of spentMap) if (!top || amount > top.amount) top = { id, amount };
    if (top) {
      const pct = Math.round(top.amount / expense * 100);
      insights.push({ score: pct > 30 ? pct : 10, text: "Kategori terbesar bulan ini: " + (catById(top.id)?.name || "?") + " (" + pct + "%)" });
    }
  }
  insights.sort((a, b) => b.score - a.score);
  const top5 = insights.slice(0, 5);
  if (!top5.length) return el("div", { style: "display:none;" });

  const card = el("div", { class: "card" });
  const head = el("div", { style: "display:flex;align-items:center;gap:8px;margin-bottom:12px;" }, [
    icon("bulb", 18, "accent"),
    el("h2", { class: "card-title", style: "margin:0;", text: "Insight Cerdas" })
  ]);
  card.append(head);
  for (const i of top5) {
    const item = el("div", { class: "insight-item" }, [
      el("div", { class: "insight-icon" }, [icon("lightning", 14)]),
      el("div", { style: "flex:1;font-weight:500;", text: i.text })
    ]);
    card.append(item);
  }
  return card;
}

/* ---------- transactions ---------- */
function filteredTx() {
  const f = state.txFilter;
  return state.transactions.filter(t => {
    if (f.month && t.date.slice(0, 7) !== f.month) return false;
    if (f.category && t.category_id !== f.category) return false;
    if (f.type && t.type !== f.type) return false;
    if (f.q && !(t.note || "").toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  }).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (a.created_at < b.created_at ? 1 : -1)));
}
function recentCombos() {
  const seen = new Set();
  const out = [];
  const sorted = [...state.transactions].sort((a, b) => (a.created_at < b.created_at ? 1 : -1));
  for (const t of sorted) {
    const k = t.category_id + ":" + t.amount;
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(t);
    if (out.length === 5) break;
  }
  return out;
}

async function quickAdd(src) {
  const row = {
    id: uid(), date: localDate(), type: src.type, amount: src.amount,
    category_id: src.category_id, note: src.note || "", created_at: nowIso(), updated_at: nowIso(),
  };
  state.transactions.push(row);
  saveLocal();
  render();
  try {
    await cloudWrite("transactions", "insert", row);
    toast("Tercatat: " + (catById(src.category_id)?.name || "") + " " + rp(src.amount));
  } catch (err) {
    rollbackTx(row.id);
    toast("Gagal mencatat: " + (err.message || err));
  }
}

function deleteTx(t) {
  const idx = state.transactions.findIndex(x => x.id === t.id);
  if (idx < 0) return;
  const copy = state.transactions[idx];
  state.transactions.splice(idx, 1);
  saveLocal();
  render();
  let undone = false;
  toast("Transaksi dihapus", {
    label: "Urungkan",
    fn: () => {
      undone = true;
      state.transactions.push(copy);
      saveLocal();
      render();
    }
  });
  setTimeout(async () => {
    if (undone) return;
    try { await cloudWrite("transactions", "delete", copy, { id: copy.id }); }
    catch (err) { state.transactions.push(copy); saveLocal(); render(); toast("Gagal menghapus: " + (err.message || err)); }
  }, 6000);
}

function rollbackTx(id) {
  const i = state.transactions.findIndex(t => t.id === id);
  if (i >= 0) state.transactions.splice(i, 1);
  saveLocal();
  render();
}

function openTxForm(existing) {
  const isEdit = !!(existing && existing.id);
  const draft = {
    date: existing?.date || localDate(),
    type: existing?.type || "expense",
    amount: existing?.amount ? String(existing.amount) : "",
    category_id: existing?.category_id || "",
    note: existing?.note || "",
  };
  openModal(isEdit ? "Ubah Transaksi" : "Catat Transaksi", (body, close) => {
    const typeSeg = el("div", { class: "seg full-width", style: "margin-bottom:16px;" });
    const btnExp = el("button", { type: "button", text: "Pengeluaran", "aria-pressed": draft.type === "expense" ? "true" : "false" });
    const btnInc = el("button", { type: "button", text: "Pemasukan", "aria-pressed": draft.type === "income" ? "true" : "false" });
    typeSeg.append(btnExp, btnInc);

    const amountWrap = el("div", { class: "amount-hero" });
    const rpSpan = el("span", { class: "rp-prefix", text: "Rp" });
    const amount = el("input", {
      type: "text", inputmode: "numeric", autocomplete: "off", placeholder: "0",
      "aria-label": "Jumlah transaksi dalam rupiah",
      value: draft.amount ? formatThousands(draft.amount) : ""
    });
    amountWrap.append(rpSpan, amount);

    const date = el("input", { type: "date", value: draft.date, required: "true" });
    const cat = el("select", { "aria-label": "Pilih kategori" });
    const note = el("input", { type: "text", placeholder: "Contoh: Nasi padang, bensin, dll", value: draft.note, maxlength: "200" });

    function refillCats() {
      clear(cat);
      cat.append(el("option", { value: "", text: "Pilih kategori..." }));
      for (const c of activeCats(draft.type)) {
        const o = el("option", { value: c.id, text: c.name });
        if (c.id === draft.category_id) o.selected = true;
        cat.append(o);
      }
    }

    btnExp.addEventListener("click", () => {
      draft.type = "expense";
      btnExp.setAttribute("aria-pressed", "true");
      btnInc.setAttribute("aria-pressed", "false");
      draft.category_id = "";
      refillCats();
    });
    btnInc.addEventListener("click", () => {
      draft.type = "income";
      btnInc.setAttribute("aria-pressed", "true");
      btnExp.setAttribute("aria-pressed", "false");
      draft.category_id = "";
      refillCats();
    });

    refillCats();
    amount.addEventListener("input", () => {
      const digits = amount.value.replace(/\D/g, "").replace(/^0+(?=\d)/, "");
      amount.value = formatThousands(digits);
    });

    body.append(
      typeSeg,
      amountWrap,
      field("Kategori", cat),
      field("Tanggal", date),
      field("Catatan (opsional)", note),
      el("button", { type: "button", class: "btn btn-primary full-width", style: "margin-top:10px;", text: "Simpan Transaksi", onclick: async () => {
        const digits = amount.value.replace(/\D/g, "");
        const value = Number(digits);
        if (!date.value) return toast("Tanggal wajib diisi.");
        if (!value || value <= 0) return toast("Jumlah harus lebih dari 0.");
        if (!cat.value) return toast("Kategori wajib dipilih.");
        const row = {
          id: existing?.id || uid(),
          date: date.value,
          type: draft.type,
          amount: value,
          category_id: cat.value,
          note: note.value.trim(),
          created_at: existing?.created_at || nowIso(),
          updated_at: nowIso(),
        };
        const prev = existing ? { ...existing } : null;
        if (isEdit) {
          const i = state.transactions.findIndex(t => t.id === row.id);
          if (i >= 0) state.transactions[i] = row;
        } else state.transactions.push(row);
        saveLocal();
        close();
        render();
        try {
          if (isEdit) await cloudWrite("transactions", "update", row, { id: row.id });
          else await cloudWrite("transactions", "insert", row);
        } catch (err) {
          if (isEdit && prev) {
            const i = state.transactions.findIndex(t => t.id === row.id);
            if (i >= 0) state.transactions[i] = prev;
          } else rollbackTx(row.id);
          toast("Gagal menyimpan: " + (err.message || err));
        }
      }}),
    );
    setTimeout(() => amount.focus(), 60);
  });
}

function formatThousands(digits) {
  const s = String(digits || "").replace(/\D/g, "");
  if (!s) return "";
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function field(label, control) {
  const id = "f-" + uid();
  control.id = id;
  return el("label", { class: "field" }, [el("span", { text: label }), control]);
}

        icon("check", 14),
        el("span", { text: "Salin dari Bulan Lalu" })
      ]),
    ]));
  }
  const spent = spentByCat(key);
  const cats = activeCats("expense");
  if (!cats.length) {

      el("div", { class: "empty-icon", text: "🎯" }),
      el("p", { class: "empty-title", text: "Belum ada kategori pengeluaran." }),
      el("button", { type: "button", class: "btn btn-primary", text: "Tambah Kategori", onclick: () => editCategory(null) })
    ]));
    return;
  }
  for (const c of cats) {
    const b = state.budgets.find(x => x.month === key && x.category_id === c.id);
    const used = spent.get(c.id) || 0;
    const card = el("div", { class: "card budget-item-card" });
    const topRow = el("div", { class: "budget-top-row" });
    topRow.append(el("strong", { class: "budget-cat-name", text: c.name }));

    if (!b) {
      topRow.append(el("span", { class: "tag muted-tag", text: "Belum diatur" }));
      card.append(topRow);
      card.append(el("div", { class: "small muted", style: "margin:6px 0 10px;", text: "Terpakai: " + rp(used) }));
      const inputWrap = el("div", { style: "display:flex;gap:8px;" });
      const input = el("input", { type: "text", inputmode: "numeric", "aria-label": "Budget " + c.name, placeholder: "Atur budget (Rp)" });
      input.addEventListener("input", () => { input.value = formatThousands(input.value.replace(/\D/g, "")); });
      const saveBtn = el("button", { type: "button", class: "btn btn-primary btn-sm", text: "Simpan", onclick: () => saveBudget(key, c.id, input.value) });
      inputWrap.append(input, saveBtn);
      card.append(inputWrap);
    } else {
      const remain = Number(b.amount) - used;
      const ratio = b.amount > 0 ? used / b.amount : (used > 0 ? 2 : 0);
      const cls = ratio > 1 ? "over" : ratio >= 0.8 ? "warn" : "ok";
      const label = ratio > 1 ? "Melebihi budget" : ratio >= 0.8 ? "Hampir habis" : "Aman";
      topRow.append(el("span", { class: "tag " + cls, text: label }));
      card.append(topRow);

      const meta = el("div", { class: "budget-meta" }, [
        el("span", { text: "Budget: " + rp(b.amount) }),
        el("span", { text: "Terpakai: " + rp(used) }),
        el("span", { class: "budget-remain " + cls, text: "Sisa: " + (remain < 0 ? "-" : "") + rp(Math.abs(remain)) })
      ]);
      const track = el("div", { class: "bar-track", style: "margin:10px 0" });
      track.append(el("div", { class: "bar-fill " + cls, style: "width:" + Math.min(100, ratio * 100) + "%" }));
      card.append(meta, track);

      const editWrap = el("div", { class: "budget-inline-edit" });

      editWrap.append(el("span", { class: "small muted", text: "Ubah batas:" }), input);
      card.append(editWrap);
    }
    main.append(card);
  }
}

async function saveBudget(month, category_id, raw) {
  const amount = Number(String(raw).replace(/\D/g, ""));
  if (!Number.isFinite(amount) || amount < 0) return toast("Jumlah budget tidak valid.");
  const prev = state.budgets.find(b => b.month === month && b.category_id === category_id);
  const row = { user_id: state.user?.id, month, category_id, amount };
  if (prev) Object.assign(prev, row);
  else state.budgets.push(row);
  saveLocal();
  render();
  try { await cloudWrite("budgets", "upsert", row); }
  catch (err) {
    if (prev) Object.assign(state.budgets.find(b => b.month === month && b.category_id === category_id) || {}, prev);
    toast("Gagal menyimpan budget: " + (err.message || err));
    render();
  }
}
async function copyBudgets(key) {
  const prevKey = addMonths(key, -1);
  const prev = budgetsFor(prevKey);
  for (const b of prev) {
    if (!state.budgets.some(x => x.month === key && x.category_id === b.category_id)) {
      state.budgets.push({ month: key, category_id: b.category_id, amount: b.amount });
    }
  }
  saveLocal();
  render();
  try {
    if (state.mode === "cloud") {
      const { error } = await state.sb.from("budgets").upsert(budgetsFor(key).map(b => ({ month: b.month, category_id: b.category_id, amount: b.amount })));
      if (error) throw error;
    }
    toast("Budget disalin dari bulan lalu.");
  } catch (err) { toast("Gagal menyalin: " + (err.message || err)); }
}

  const meta = document.querySelector('meta[name="theme-color"]');

function rollbackCat(id) {

async function archiveCategory(c) {

/* ---------- CSV ---------- */
function csvEscape(val) {
  const s = String(val == null ? "" : val);
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv() {
  const rows = [["date","type","category","amount","note"]];
  for (const t of [...state.transactions].sort((a, b) => a.date.localeCompare(b.date))) {
    const name = catById(t.category_id)?.name || "";
    rows.push([t.date, t.type, name, t.amount, t.note || ""]);
  }
  const body = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const bom = "\uFEFF";
  download(bom + body, `duitku-${localDate()}.csv`, "text/csv;charset=utf-8");
}
function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function pickFile(accept, cb) {
  const input = el("input", { type: "file", accept });
  input.onchange = () => {
    const file = input.files?.[0];
    if (file) cb(file);
  };
  input.click();
}

function parseCsv(text) {
  let s = text.replace(/^\uFEFF/, "");
  const firstLine = s.split(/\r\n|\n|\r/)[0] || "";
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += ch; i++;
    } else {
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delim) { row.push(field); field = ""; i++; continue; }
      if (ch === "\r" || ch === "\n") {
        row.push(field); field = "";
        if (ch === "\r" && s[i + 1] === "\n") i++;
        i++;
        if (row.some(x => x.trim().length)) rows.push(row);
        row = [];
        continue;
      }
      field += ch; i++;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    if (row.some(x => x.trim().length)) rows.push(row);
  }
  return { delim, rows };
}

function guessMap(headers) {
  const out = { date: -1, type: -1, category: -1, amount: -1, note: -1 };
  headers.forEach((h, idx) => {
    const norm = h.trim().toLowerCase();
    if (["date","tanggal","tgl"].includes(norm)) out.date = idx;
    else if (["type","jenis","tipe"].includes(norm)) out.type = idx;
    else if (["category","kategori","pos"].includes(norm)) out.category = idx;
    else if (["amount","jumlah","nominal","total","nilai"].includes(norm)) out.amount = idx;
    else if (["note","catatan","keterangan","deskripsi","memo"].includes(norm)) out.note = idx;
  });
  return out;
}

function parseAmount(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/^rp\.?\s*/i, "").trim();
  if (/^\d+$/.test(s)) return Number(s);
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, ""));
  if (/^\d{1,3}(,\d{3})+$/.test(s)) return Number(s.replace(/,/g, ""));
  return null;
}
function parseDateLoose(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const d = parseDate(s);
    return isNaN(d.getTime()) ? null : s;
  }
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const [_, d, mo, y] = m;
    const iso = `${y}-${pad(mo)}-${pad(d)}`;
    const dt = parseDate(iso);
    return isNaN(dt.getTime()) ? null : iso;
  }
  return null;
}
function parseTypeLoose(raw) {
  const s = String(raw || "").trim().toLowerCase();
  if (["income","pemasukan","masuk"].includes(s)) return "income";
  if (["expense","pengeluaran","keluar"].includes(s)) return "expense";
  return null;
}

function txSig(t) {
  const catName = (catById(t.category_id)?.name || t.category_name || "").toLowerCase();
  return [t.date, t.type, catName, Number(t.amount), (t.note || "").trim().toLowerCase()].join("|");
}

function startCsvImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { delim, rows } = parseCsv(String(reader.result));
      if (rows.length < 2) return toast("File CSV kosong atau tidak memiliki baris data.");
      reviewImport(rows);
    } catch (err) { toast("Gagal membaca CSV: " + err.message); }
  };
  reader.readAsText(file, "utf-8");
}

    const unknownMap = new Map();
    function scanUnknown() {
      unknownMap.clear();
      const catIdx = Number(selects.category.value);
      const typeIdx = Number(selects.type.value);
      if (catIdx < 0) return;
      for (const r of dataRows) {
        const name = (r[catIdx] || "").trim();

        const tVal = typeIdx >= 0 ? parseTypeLoose(r[typeIdx]) || "expense" : "expense";

        if (!found && !unknownMap.has(name)) unknownMap.set(name, { choice: "create", type: tVal });
      }
    }
    scanUnknown();

    const unknownCard = el("div", { class: "card", style: "margin-bottom:12px" });
    function renderUnknown() {
      clear(unknownCard);
      unknownCard.append(el("h3", { text: "Kategori Baru Terdeteksi", style: "margin:0 0 8px;font-size:0.95rem" }));
      if (!unknownMap.size) {
        unknownCard.append(el("p", { class: "muted small", text: "Semua kategori cocok dengan data yang sudah ada." }));
        return;
      }
      for (const [name, meta] of unknownMap) {
        const sel = el("select", { onchange: e => { meta.choice = e.target.value; } }, [

    }

    for (const s of Object.values(selects)) {
      s.addEventListener("change", () => { scanUnknown(); renderUnknown(); });
    }

    const prevCard = el("div", { class: "card", style: "margin-bottom:12px" }, [
      el("h3", { text: "10 Baris Pertama", style: "margin:0 0 8px;font-size:0.95rem" })
    ]);

    const headRow = el("tr");
    for (const h of headers) headRow.append(el("th", { style: "border-bottom:1px solid var(--border);padding:4px;text-align:left;", text: h }));
    tbl.append(headRow);

      for (const col of r) rowEl.append(el("td", { style: "border-bottom:1px solid var(--border);padding:4px;", text: col }));
      tbl.append(rowEl);
    }

    body.append(prevCard);

    body.append(el("button", {
