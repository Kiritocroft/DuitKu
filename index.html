async function quickAdd(src) {
  const row = {
    id: uid(), date: localDate(), type: src.type, amount: src.amount,
    category_id: src.category_id, note: src.note || "", created_at: nowIso(), updated_at: nowIso(),
  };
  state.transactions.push(row);
  saveLocal();
  playChime(src.type === "income" ? "coin" : "pop");
  render();
  try {
    await cloudWrite("transactions", "insert", row);
    toast(t("toast_tx_logged", { name: catNameById(src.category_id), amount: rp(src.amount) }));
  } catch (err) {
    rollbackTx(row.id);
    toast("Gagal mencatat: " + (err.message || err));
  }
}

function deleteTx(tRow) {
  const idx = state.transactions.findIndex(x => x.id === tRow.id);
  if (idx < 0) return;
  const copy = state.transactions[idx];
  const walletEntry = state.ledgerEvents.find(e => e.tx_id === copy.id);
  state.transactions.splice(idx, 1);
  state.ledgerEvents = state.ledgerEvents.filter(e => e.tx_id !== copy.id);
  saveLocal();
  if (walletEntry && state.mode === "cloud" && state.sb) state.sb.from("ledger_events").delete().eq("id", walletEntry.id).then(({ error }) => { if (error) console.error("Wallet event delete sync failed:", error.message); });
  render();
  let undone = false;
  toast(t("toast_tx_deleted"), {
    label: t("toast_undo"),
    fn: () => {
      undone = true;
      state.transactions.push(copy);
      saveLocal();
      render();
    }
  });
  setTimeout(async () => {
    if (undone) return;
    try { await cloudWrite("transactions", "delete", copy, { id: copy.id }); }
    catch (err) { state.transactions.push(copy); saveLocal(); render(); toast("Gagal menghapus: " + (err.message || err)); }
  }, 6000);
}

function rollbackTx(id) {
  const i = state.transactions.findIndex(t => t.id === id);
  if (i >= 0) state.transactions.splice(i, 1);
  saveLocal();
  render();
}

function openWalletAction(kind) {
  const en = state.lang === "en";
  const labels = { transfer: en ? "Transfer" : "Transfer", lend: en ? "Lend cash" : "Pinjamkan tunai", repay: en ? "Repayment" : "Terima cicilan", adjust: en ? "Reconcile wallet" : "Rekonsiliasi dompet" };
  openModal(labels[kind], (body, close) => {
    const wallet = el("select", { "aria-label": en ? "Wallet" : "Dompet" }, [el("option", { value: "cash", text: en ? "Cash" : "Tunai" }), el("option", { value: "DANA", text: "DANA" })]);
    const target = el("select", { "aria-label": en ? "Destination wallet" : "Dompet tujuan" }, [el("option", { value: "DANA", text: "DANA" }), el("option", { value: "cash", text: en ? "Cash" : "Tunai" })]);
    const amount = el("input", { type: "text", inputmode: "numeric", placeholder: en ? "Amount" : "Jumlah" });
    amount.addEventListener("input", () => { amount.value = formatThousands(amount.value.replace(/\D/g, "")); });
    const note = el("input", { type: "text", maxlength: "200", placeholder: en ? "Note (optional)" : "Catatan (opsional)" });
    const reconcile = kind === "adjust";
    body.append(field(en ? "Wallet" : "Dompet", wallet));
    if (kind === "transfer") body.append(field(en ? "To" : "Ke", target));
    body.append(field(reconcile ? (en ? "Actual balance" : "Saldo aktual") : (en ? "Amount" : "Jumlah"), amount), field(en ? "Note" : "Catatan", note));
    body.append(el("button", { type: "button", class: "btn btn-primary full-width", text: en ? "Save" : "Simpan", onclick: async () => {
      const value = Number(amount.value.replace(/\D/g, ""));
      if (!Number.isSafeInteger(value) || (reconcile ? value < 0 : value <= 0)) return toast(en ? "Enter a valid amount." : "Masukkan jumlah yang valid.");
      const before = walletBalances();
      const delta = reconcile ? value - before[wallet.value] : value;
      if (kind === "transfer" && wallet.value === target.value) return toast(en ? "Choose a different destination wallet." : "Pilih dompet tujuan yang berbeda.");
      if ((kind === "transfer" && before[wallet.value] < value) || (kind === "lend" && before.cash < value) || (kind === "repay" && before.receivable < value)) return toast(en ? "Insufficient balance." : "Saldo/piutang tidak cukup.");
      if (reconcile && delta === 0) return toast(en ? "Balance already matches." : "Saldo sudah sesuai.");
      const entryKind = kind === "adjust" ? "reconcile" : kind;
      const entry = { id: uid(), date: localDate(), created_at: nowIso(), kind: entryKind, wallet: kind === "lend" ? "cash" : wallet.value, amount: delta, note: note.value.trim() };
      if (kind === "transfer") entry.to_wallet = target.value;
      state.ledgerEvents.push(entry); saveLocal(); close(); render(); syncWalletEvent(entry);
      toast(en ? "Wallet updated!" : "Dompet diperbarui!");
    }}));
  });
}

  });

function formatThousands(digits) {
  const s = String(digits || "").replace(/\D/g, "");
  if (!s) return "";
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function field(label, control) {
  const id = "f-" + uid();
  control.id = id;
  return el("label", { class: "field" }, [el("span", { text: label }), control]);
}

/* ---------- goals (wishlist & debt) ---------- */
function goalCard(g) {
  const card = el("div", { class: "card goal-card" });
  const head = el("div", { style: "display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;" });
  head.append(
    el("strong", { style: "font-weight:700;", text: g.name }),
    el("span", { class: "tag " + (g.kind === "debt" ? "over" : "ok"), text: g.kind === "debt" ? t("goal_debt_badge") : t("goal_wish_badge") })
  );
  card.append(head);

  const bal = balance();
  const target = Number(g.amount);
  const progress = Math.max(0, Math.min(bal, target));
  const pct = target > 0 ? Math.min(100, Math.round(bal / target * 100)) : 0;
  const reached = bal >= target;

  if (g.due) card.append(el("div", { class: "small muted", text: (state.lang === "en" ? "Due " : "Tenggat ") + g.due }));
  card.append(el("div", { class: "muted small", style: "margin-bottom:8px;", text: t("goal_progress", { progress: rp(progress), target: rp(target) }) }));
  const track = el("div", { class: "bar-track", style: "margin-bottom:10px;" });
  track.append(el("div", { class: "bar-fill " + (g.kind === "debt" && g.status !== "done" ? "over" : "ok"), style: "width:" + Math.max(2, pct) + "%" }));
  card.append(track);

  if (g.status === "done") {
    card.append(el("span", { class: "tag ok", text: t("goal_done") }));
  } else {
    const btnRow = el("div", { style: "display:flex;gap:8px;flex-wrap:wrap;" });
    btnRow.append(
      el("button", { type: "button", class: "btn btn-primary btn-sm", text: g.kind === "debt" ? t("goal_approve_debt") : t("goal_approve_wish"), onclick: () => approveGoal(g) }),
      el("button", { type: "button", class: "btn btn-sm", "aria-label": state.lang === "en" ? "Edit" : "Ubah", onclick: () => openGoalForm(g.kind, g) }, [icon("edit", 14)]),
      el("button", { type: "button", class: "btn btn-danger btn-sm", "aria-label": t("goal_delete"), onclick: () => deleteGoal(g) }, [icon("trash", 14)])
    );
    card.append(btnRow);
    if (reached) {
      card.append(el("div", { class: "small", style: "margin-top:8px;color:var(--ok);font-weight:600;", text: t("goal_reached") }));
    } else if (state.allowance?.enabled && Number(state.allowance.amount) > 0) {
      const remain = target - Math.max(0, bal);
      const days = Math.ceil(remain / Number(state.allowance.amount));
      if (days > 0 && days < 999) {
        card.append(el("div", { class: "small muted", style: "margin-top:8px;", text: t("goal_est_days", { days: String(days) }) }));
      }
    }
  }
  return card;
}

/* ---------- CSV ---------- */
function csvEscape(val) {
  const s = String(val == null ? "" : val);
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCsv() {
  const rows = [["date","type","category","amount","note"]];
  for (const t of [...state.transactions].sort((a, b) => a.date.localeCompare(b.date))) {
    const name = catById(t.category_id)?.name || "";
    rows.push([t.date, t.type, name, t.amount, t.note || ""]);
  }
  const body = rows.map(r => r.map(csvEscape).join(",")).join("\r\n");
  const bom = "\uFEFF";
  download(bom + body, `duitku-${localDate()}.csv`, "text/csv;charset=utf-8");
}
function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function pickFile(accept, cb) {
  const input = el("input", { type: "file", accept });
  input.onchange = () => {
    const file = input.files?.[0];
    if (file) cb(file);
  };
  input.click();
}

function parseCsv(text) {
  let s = text.replace(/^\uFEFF/, "");
  const firstLine = s.split(/\r\n|\n|\r/)[0] || "";
  const delim = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ";" : ",";
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += ch; i++;
    } else {
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delim) { row.push(field); field = ""; i++; continue; }
      if (ch === "\r" || ch === "\n") {
        row.push(field); field = "";
        if (ch === "\r" && s[i + 1] === "\n") i++;
        i++;
        if (row.some(x => x.trim().length)) rows.push(row);
        row = [];
        continue;
      }
      field += ch; i++;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    if (row.some(x => x.trim().length)) rows.push(row);
  }
  return { delim, rows };
}

function guessMap(headers) {
  const out = { date: -1, type: -1, category: -1, amount: -1, note: -1 };
  headers.forEach((h, idx) => {
    const norm = h.trim().toLowerCase();
    if (["date","tanggal","tgl"].includes(norm)) out.date = idx;
    else if (["type","jenis","tipe"].includes(norm)) out.type = idx;
    else if (["category","kategori","pos"].includes(norm)) out.category = idx;
    else if (["amount","jumlah","nominal","total","nilai"].includes(norm)) out.amount = idx;
    else if (["note","catatan","keterangan","deskripsi","memo"].includes(norm)) out.note = idx;
  });
  return out;
}

function parseAmount(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/^rp\.?\s*/i, "").trim();
  if (/^\d+$/.test(s)) return Number(s);
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) return Number(s.replace(/\./g, ""));
  if (/^\d{1,3}(,\d{3})+$/.test(s)) return Number(s.replace(/,/g, ""));
  return null;
}
function parseDateLoose(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    const d = parseDate(s);
    return isNaN(d.getTime()) ? null : s;
  }
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const [_, d, mo, y] = m;
    const iso = `${y}-${pad(mo)}-${pad(d)}`;
    const dt = parseDate(iso);
    return isNaN(dt.getTime()) ? null : iso;
  }
  return null;
}
function parseTypeLoose(raw) {
  const s = String(raw || "").trim().toLowerCase();
  if (["income","pemasukan","masuk"].includes(s)) return "income";
  if (["expense","pengeluaran","keluar"].includes(s)) return "expense";
  return null;
}

function txSig(t) {
  const catName = (catById(t.category_id)?.name || t.category_name || "").toLowerCase();
  return [t.date, t.type, catName, Number(t.amount), (t.note || "").trim().toLowerCase()].join("|");
}

function startCsvImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const { delim, rows } = parseCsv(String(reader.result));
      if (rows.length < 2) return toast("File CSV kosong atau tidak memiliki baris data.");
      reviewImport(rows);
    } catch (err) { toast("Gagal membaca CSV: " + err.message); }
  };
  reader.readAsText(file, "utf-8");
}

function reviewImport(rows) {
  const headers = rows[0];
  const dataRows = rows.slice(1);
  const mapping = guessMap(headers);
  const existingSigs = new Set(state.transactions.map(txSig));

  openModal("Pratinjau Impor CSV", (body, close) => {

      ["type", "Jenis", mapping.type],
      ["category", "Kategori", mapping.category],
      ["amount", "Jumlah", mapping.amount],
      ["note", "Catatan", mapping.note],
    ];
    const selects = {};
    const mapGrid = el("div", { class: "grid grid-2" });
    for (const [k, lbl, guessed] of fields) {
      const sel = el("select");
      sel.append(el("option", { value: "-1", text: "(abaikan)" }));
      headers.forEach((h, idx) => {
        const o = el("option", { value: String(idx), text: `${idx + 1}. ${h}` });

        sel.append(o);

    const dupBox = el("div", { class: "card", style: "margin-bottom:12px" });
    const dupSel = el("select", {}, [
      el("option", { value: "skip", text: "Lewati baris duplikat" }),
      el("option", { value: "import", text: "Tetap impor duplikat" }),
    ]);
    dupBox.append(field("Penanganan Duplikat", dupSel));
    body.append(dupBox);

    const unknownMap = new Map();
    function scanUnknown() {
      unknownMap.clear();
      const catIdx = Number(selects.category.value);
      const typeIdx = Number(selects.type.value);
      if (catIdx < 0) return;
      for (const r of dataRows) {
        const name = (r[catIdx] || "").trim();
        if (!name) continue;
        const tVal = typeIdx >= 0 ? parseTypeLoose(r[typeIdx]) || "expense" : "expense";
        const found = state.categories.find(c => c.name.toLowerCase() === name.toLowerCase());
        if (!found && !unknownMap.has(name)) unknownMap.set(name, { choice: "create", type: tVal });
      }

      clear(unknownCard);
      unknownCard.append(el("h3", { text: "Kategori Baru Terdeteksi", style: "margin:0 0 8px;font-size:0.95rem" }));

      }
      for (const [name, meta] of unknownMap) {
        const sel = el("select", { onchange: e => { meta.choice = e.target.value; } }, [
          el("option", { value: "create", text: `Buat kategori baru "${name}"` }),
          el("option", { value: "other", text: `Masukkan ke "Lainnya"` }),
        ]);
        unknownCard.append(field(name, sel));
      }
    }
    renderUnknown();
    body.append(unknownCard);

    for (const s of Object.values(selects)) {
      s.addEventListener("change", () => { scanUnknown(); renderUnknown(); });
    }

    const prevCard = el("div", { class: "card", style: "margin-bottom:12px" }, [
      el("h3", { text: "10 Baris Pertama", style: "margin:0 0 8px;font-size:0.95rem" })

    const headRow = el("tr");

    body.append(el("button", {

        }

        close();
      }
    }));
  });
}

async function commitImport(rows, map, unknownMap, dupChoice, existingSigs) {
  let imported = 0, skipped = 0, dups = 0;
  const invalidReasons = [];
  const fileSigs = new Set();
  const toInsert = [];
  const createdCats = new Map();

  for (let idx = 0; idx < rows.length; idx++) {
    const r = rows[idx];
    const lineNum = idx + 2;
    const rawDate = r[map.date];
    const rawType = map.type >= 0 ? r[map.type] : "expense";
    const rawCat = (r[map.category] || "").trim();
    const rawAmount = r[map.amount];
    const rawNote = map.note >= 0 ? (r[map.note] || "").trim() : "";

    const date = parseDateLoose(rawDate);
    if (!date) { skipped++; invalidReasons.push(`Baris ${lineNum}: tanggal tidak valid "${rawDate}"`); continue; }
    const type = parseTypeLoose(rawType);
    if (!type) { skipped++; invalidReasons.push(`Baris ${lineNum}: jenis tidak valid "${rawType}"`); continue; }
    const amount = parseAmount(rawAmount);
    if (!amount || amount <= 0) { skipped++; invalidReasons.push(`Baris ${lineNum}: jumlah tidak valid "${rawAmount}"`); continue; }
    if (!rawCat) { skipped++; invalidReasons.push(`Baris ${lineNum}: kategori kosong`); continue; }

    let catId = resolveCat(rawCat, type, unknownMap, createdCats);
    const sig = [date, type, rawCat.toLowerCase(), amount, rawNote.toLowerCase()].join("|");
    const isDup = existingSigs.has(sig) || fileSigs.has(sig);
    if (isDup) {
      dups++;
      if (dupChoice === "skip") continue;
    }
    fileSigs.add(sig);

    toInsert.push({
      id: uid(), date, type, amount, category_id: catId, note: rawNote,
      created_at: nowIso(), updated_at: nowIso(),
    });
    imported++;
  }

  for (const cat of createdCats.values()) {
    state.categories.push(cat);
    try { await cloudWrite("categories", "insert", cat); } catch {}
  }

  for (const row of toInsert) state.transactions.push(row);
  saveLocal();
  render();

  if (state.mode === "cloud" && toInsert.length) {
    try {
      await insertChunked("transactions", toInsert.map(x => ({ ...x, user_id: state.user.id })));
    } catch (err) {
      toast("Sebagian data cloud gagal disimpan: " + (err.message || err));
    }
  }

  toast(`${imported} diimpor, ${skipped} dilewati, ${dups} duplikat.`);
  if (invalidReasons.length) {
    openModal("Baris yang Dilewati", body => {
      const ul = el("ul", { style: "padding-left:18px;font-size:0.85rem;" });
      for (const r of invalidReasons.slice(0, 50)) ul.append(el("li", { text: r }));
      if (invalidReasons.length > 50) ul.append(el("li", { text: `...dan ${invalidReasons.length - 50} lainnya` }));
      body.append(ul);
    });
  }
}

function resolveCat(name, type, unknownMap, createdCats) {
  const norm = name.toLowerCase();
  const existing = state.categories.find(c => c.name.toLowerCase() === norm);
  if (existing) return existing.id;
  if (createdCats.has(norm)) return createdCats.get(norm).id;
  const meta = unknownMap.get(name);
  if (!meta || meta.choice === "create") {
    const row = { id: uid(), name, type, archived: false, sort_order: state.categories.length + createdCats.size };
    createdCats.set(norm, row);
    return row.id;
  }
  const fallback = state.categories.find(c => c.name.toLowerCase() === "lainnya" && c.type === type)
    || state.categories.find(c => c.type === type)
    || state.categories[0];
  return fallback ? fallback.id : uid();
}

/* ---------- JSON backup & restore ---------- */
function exportJson() {
  const payload = {
    version: 2,
    exported_at: nowIso(),
    categories: state.categories,
    transactions: state.transactions,
    goals: state.goals || [],
    allowance: state.allowance || { amount: 20000, enabled: true, lastClaim: "" },
    budgets: state.budgets || [],
  };
  download(JSON.stringify(payload, null, 2), `duitku-backup-${localDate()}.json`, "application/json");
}
function startJsonRestore(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!Array.isArray(data.categories) || !Array.isArray(data.transactions)) {
        return toast(state.lang === "en" ? "Invalid JSON backup format." : "Format file JSON cadangan tidak valid.");
      }
      const isEn = state.lang === "en";
      const goalCount = Array.isArray(data.goals) ? data.goals.length : 0;
      if (!confirm(isEn
        ? `Restore this backup? (${data.transactions.length} transactions, ${goalCount} goals). Current data will be replaced.`
        : `Pulihkan cadangan ini? (${data.transactions.length} transaksi, ${goalCount} target). Data sekarang akan ditimpa.`)) return;
      state.categories = data.categories;
      state.transactions = data.transactions;
      if (Array.isArray(data.goals)) state.goals = data.goals;
      if (Array.isArray(data.budgets)) state.budgets = data.budgets;
      if (data.allowance && typeof data.allowance === "object") state.allowance = data.allowance;
      saveLocal();
      render();
      if (state.mode === "cloud" && state.user && state.sb) {
        await wipeAllCloud();
        await state.sb.from("categories").insert(state.categories.map(c => ({ ...c, user_id: state.user.id })));
        await insertChunked("transactions", state.transactions.map(t => ({ ...t, user_id: state.user.id })));
        if (state.goals && state.goals.length) await state.sb.from("goals").insert(state.goals.map(g => ({ ...g, user_id: state.user.id })));
        if (state.allowance) await saveAllowanceSetting();
      }
      playChime("coin");
      toast(isEn ? "Data restored successfully from JSON." : "Data berhasil dipulihkan dari JSON.");
    } catch (err) { toast("Gagal memulihkan: " + (err.message || err)); }
  };
  reader.readAsText(file, "utf-8");
}

/* ---------- sample data & reset ---------- */
async function loadSample() {
  const isEn = state.lang === "en";
  if (!confirm(isEn ? "Load sample data with ~3 months of student expenses? This will be added to your history." : "Muat data contoh ~3 bulan pengeluaran mahasiswa? Data akan ditambahkan ke riwayatmu.")) return;
  const sample = buildSample();
  for (const t of sample) state.transactions.push(t);
  const curMonth = monthKey();
  const prev1 = addMonths(curMonth, -1);
  const prev2 = addMonths(curMonth, -2);
  const catMakan = state.categories.find(c => c.name === "Makan")?.id;
  const catKos = state.categories.find(c => c.name === "Kos")?.id;
  const catJajan = state.categories.find(c => c.name === "Jajan")?.id;
  for (const m of [prev2, prev1, curMonth]) {
    if (catMakan) state.budgets.push({ month: m, category_id: catMakan, amount: 800000 });
    if (catKos) state.budgets.push({ month: m, category_id: catKos, amount: 750000 });
    if (catJajan) state.budgets.push({ month: m, category_id: catJajan, amount: 300000 });
  }
  saveLocal();
  render();
  if (state.mode === "cloud") {
    try {
      await insertChunked("transactions", sample.map(x => ({ ...x, user_id: state.user.id })));
      await state.sb.from("budgets").upsert(state.budgets.map(b => ({ ...b, user_id: state.user.id })));
    } catch (e) { toast((isEn ? "Failed to save sample data to cloud: " : "Gagal simpan contoh ke cloud: ") + e.message); }
  }
  toast(isEn ? "Sample data loaded successfully." : "Data contoh berhasil dimuat.");
}

function buildSample() {
  const list = [];
  const now = new Date();
  const curMonth = monthKey(now);
  const prev1 = addMonths(curMonth, -1);
  const prev2 = addMonths(curMonth, -2);

  const findCat = (n, t) => state.categories.find(c => c.name === n && c.type === t)?.id || state.categories[0].id;
  const cUangSaku = findCat("Uang Saku", "income");
  const cGaji = findCat("Gaji/Freelance", "income");
  const cMakan = findCat("Makan", "expense");
  const cJajan = findCat("Jajan", "expense");
  const cTransport = findCat("Transport", "expense");
  const cKos = findCat("Kos", "expense");
  const cPulsa = findCat("Pulsa/Internet", "expense");
  const cTugas = findCat("Tugas/Print", "expense");
  const cHiburan = findCat("Hiburan", "expense");

  function tx(date, type, catId, amount, note = "") {
    list.push({ id: uid(), date, type, amount, category_id: catId, note, created_at: nowIso(), updated_at: nowIso() });
  }

  for (const m of [prev2, prev1, curMonth]) {
    tx(`${m}-01`, "income", cUangSaku, 2000000, "Transfer ortu awal bulan");
    tx(`${m}-02`, "expense", cKos, 750000, "Bayar kos bulanan");
    tx(`${m}-03`, "expense", cPulsa, 75000, "Paket kuota internet");
  }
  tx(`${prev2}-15`, "income", cGaji, 450000, "Freelance desain poster");
  tx(`${prev1}-20`, "income", cGaji, 500000, "Asisten lab");

  for (let day = 1; day <= 28; day++) {
    const dStr = pad(day);
    tx(`${prev2}-${dStr}`, "expense", cMakan, 22000, "Makan siang warteg");
    if (day % 3 === 0) tx(`${prev2}-${dStr}`, "expense", cJajan, 15000, "Kopi susu");
    if (day % 4 === 0) tx(`${prev2}-${dStr}`, "expense", cTransport, 10000, "Bensin motor");
  }
  for (let day = 1; day <= 28; day++) {
    const dStr = pad(day);
    tx(`${prev1}-${dStr}`, "expense", cMakan, 24000, "Makan siang kantin");
    if (day % 2 === 0) tx(`${prev1}-${dStr}`, "expense", cJajan, 18000, "Boba / roti bakar");
    if (day % 5 === 0) tx(`${prev1}-${dStr}`, "expense", cTugas, 12000, "Print laporan praktikum");
  }

  const todayDate = parseDate(localDate()).getDate();
  for (let day = 1; day <= Math.min(todayDate, 28); day++) {
    const dStr = pad(day);
    tx(`${curMonth}-${dStr}`, "expense", cMakan, 25000, "Makan harian");
    if (day % 2 === 0) tx(`${curMonth}-${dStr}`, "expense", cJajan, 16000, "Es teh jumbo & cemilan");
    if (day % 3 === 0) tx(`${curMonth}-${dStr}`, "expense", cTransport, 14000, "Bensin / ojol");
  }
  tx(`${curMonth}-05`, "expense", cHiburan, 50000, "Nonton bioskop bareng kating");
  return list;
}

async function wipeAll() {
  const isEn = state.lang === "en";
  if (!confirm(isEn ? "WARNING: All transactions, budgets, and categories will be deleted!" : "PERINGATAN: Semua transaksi, budget, dan kategori akan dihapus!")) return;
  if (!confirm(isEn ? "Are you sure? This action cannot be undone." : "Apakah kamu benar-benar yakin? Tindakan ini tidak dapat dibatalkan.")) return;
  state.transactions = [];
  state.budgets = [];
  state.categories = [];
  state.goals = [];
  state.allowance = { amount: 20000, enabled: true, lastClaim: "" };
  saveLocal();
  if (state.mode === "cloud") {
    try { await wipeAllCloud(); } catch (e) { toast((isEn ? "Failed to delete cloud data: " : "Gagal hapus data cloud: ") + e.message); }
  }
  seedIfEmpty();
  saveLocal();
  render();
  toast(isEn ? "All data has been wiped." : "Semua data telah dihapus.");
}
async function wipeAllCloud() {
  await state.sb.from("transactions").delete().neq("id", "00000000-0000-0000-0000-000000000000");
  await state.sb.from("budgets").delete().neq("month", "");
  await state.sb.from("categories").delete().neq("id", "00000000-0000-0000-0000-000000000000");
  await state.sb.from("goals").delete().neq("id", "00000000-0000-0000-0000-000000000000");
  await state.sb.from("app_settings").delete().neq("user_id", "00000000-0000-0000-0000-000000000000");
}

/* ---------- auth screen ---------- */
function renderAuth() {
  clear(main);
  main.classList.add("auth-mode");
  document.body.classList.add("is-auth");
  updateHeaderExtra();
  $("#fabCatat").hidden = true;
  $("#mainNav").style.display = "none";
  showBanner("");
  setSync("");
  let tab = "masuk";

  const wrap = el("div", { class: "auth-wrap" });
  const card = el("div", { class: "auth-card" });

  const brandImg = el("img", {
    src: "icon.svg",
    alt: "Duitku",
    width: "56",
    height: "56",
    class: "auth-brand-icon"
  });
  const brand = el("div", { class: "auth-brand" }, [
    brandImg,
    el("div", { class: "auth-title", text: t("auth_title") }),
    el("div", { class: "auth-sub", text: t("auth_sub") }),
  ]);
  card.append(brand);

  const tabs = el("div", { class: "seg full-width" });
  const btnMasuk = el("button", { type: "button", text: t("auth_tab_in"), "aria-pressed": "true" });
  const btnDaftar = el("button", { type: "button", text: t("auth_tab_up"), "aria-pressed": "false" });
  tabs.append(btnMasuk, btnDaftar);
  card.append(tabs);

  const formBox = el("div", { class: "auth-form" });
  card.append(formBox);

  function paint() {
    clear(formBox);
    btnMasuk.setAttribute("aria-pressed", tab === "masuk" ? "true" : "false");
    btnDaftar.setAttribute("aria-pressed", tab === "daftar" ? "true" : "false");

    const email = el("input", { type: "email", autocomplete: "username", placeholder: "nama@kampus.ac.id", required: "true" });

    let showPass = false;
    const passWrap = el("div", { class: "pass-field-wrap" });
    const pass = el("input", { type: "password", autocomplete: tab === "masuk" ? "current-password" : "new-password", placeholder: t("auth_pass_placeholder"), required: "true", minlength: "6" });
    const togglePassBtn = el("button", {
      type: "button",
      class: "pass-toggle-btn",
      "aria-label": state.lang === "en" ? "Show password" : "Lihat kata sandi",
      onclick: () => {
        showPass = !showPass;
        pass.type = showPass ? "text" : "password";
        clear(togglePassBtn);
        togglePassBtn.append(icon(showPass ? "eyeOff" : "eye", 16));
        togglePassBtn.setAttribute("aria-label", showPass ? (state.lang === "en" ? "Hide password" : "Sembunyikan kata sandi") : (state.lang === "en" ? "Show password" : "Lihat kata sandi"));
      }
    }, [icon("eye", 16)]);
    passWrap.append(pass, togglePassBtn);

    const submitBtn = el("button", {
      type: "button", class: "btn btn-primary full-width auth-submit-btn",
      text: tab === "masuk" ? t("btn_auth_submit_in") : t("btn_auth_submit_up"),
      onclick: async () => {
        if (!email.value.includes("@")) return toast(state.lang === "en" ? "Enter a valid email." : "Isi email yang valid.");
        if (pass.value.length < 6) return toast(state.lang === "en" ? "Password must be at least 6 characters." : "Kata sandi minimal 6 karakter.");
        submitBtn.disabled = true;
        const oldText = submitBtn.textContent;
        clear(submitBtn);
        submitBtn.append(el("span", { class: "btn-spinner" }), el("span", { text: state.lang === "en" ? "Processing..." : "Memproses..." }));
        try {
          if (tab === "masuk") {
            const { data, error } = await state.sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
            if (error) throw error;
            state.user = data.user;
            bootCloud();
          } else {
            const { data, error } = await state.sb.auth.signUp({ email: email.value.trim(), password: pass.value });
            if (error) throw error;
            if (data.session) {
              state.user = data.user;
              bootCloud();
            } else {
              toast(state.lang === "en" ? "Sign up successful! Please log in." : "Pendaftaran berhasil! Silakan masuk.");
              submitBtn.disabled = false;
              clear(submitBtn);
              submitBtn.textContent = oldText;
            }
          }
        } catch (err) {
          toast(authMsg(err));
          submitBtn.disabled = false;
          clear(submitBtn);
          submitBtn.textContent = oldText;
        }
      }
    });

    const divider = el("div", { class: "auth-divider" }, [
      el("span", { text: state.lang === "en" ? "or" : "atau" })
    ]);
    const localBtn = el("button", {
      type: "button", class: "auth-local-btn",
      onclick: () => {
        enterLocal();
        $("#mainNav").style.display = "";
        render();
      }
    }, [
      icon("database", 16),
      el("span", { text: t("btn_auth_try_local") })
    ]);

    const forgotWrap = el("div", { style: "display:flex;justify-content:flex-end;margin:-4px 0 12px 0;" });
    if (tab === "masuk") {
      const forgotBtn = el("button", {
        type: "button",
        class: "btn-link text-xs",
        style: "font-size:0.8rem;color:var(--text-muted);background:none;border:none;padding:4px 0;cursor:pointer;",
        text: state.lang === "en" ? "Forgot password?" : "Lupa kata sandi?",
        onclick: async () => {
          const emailVal = email.value.trim();
          if (!emailVal || !emailVal.includes("@")) {
            return toast(state.lang === "en" ? "Enter your email first." : "Isi email Anda terlebih dahulu.");
          }
          try {
            const { error } = await state.sb.auth.resetPasswordForEmail(emailVal);
            if (error) throw error;
            toast(state.lang === "en" ? "Password reset link sent to your email!" : "Tautan reset kata sandi dikirim ke email Anda!");
          } catch (err) {
            toast(authMsg(err));
          }
        }
      });
      forgotWrap.append(forgotBtn);
    }

    formBox.append(
      field(t("field_email"), email),
      field(t("field_password"), passWrap),
      tab === "masuk" ? forgotWrap : el("div", { style: "height:4px;" }),
      submitBtn,
      divider,
      localBtn
    );
  }

  btnMasuk.onclick = () => { tab = "masuk"; paint(); };
  btnDaftar.onclick = () => { tab = "daftar"; paint(); };

  paint();
  wrap.append(card);
  main.append(wrap);
}

/* ---------- modal ---------- */
function openModal(titleText, builder) {
  const root = $("#modalRoot");
  clear(root);
  const back = el("div", { class: "modal-back" });
  const sheet = el("div", { class: "sheet", role: "dialog", "aria-modal": "true", "aria-label": titleText });
  const dragHandle = el("div", { class: "sheet-handle" });
  const head = el("div", { class: "sheet-header" });
  head.append(
    el("h2", { text: titleText, style: "margin:0;font-size:1.15rem;font-weight:750;" }),
    el("button", { type: "button", class: "btn-icon-subtle", "aria-label": "Tutup modal", onclick: close }, [icon("plus", 18, "rotate-45")])
  );
  const body = el("div", { class: "sheet-body" });
  sheet.append(dragHandle, head, body);
  back.append(sheet);
  root.append(back);

  function close() {
    document.removeEventListener("keydown", onKey);
    clear(root);
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  builder(body, close);
}

/* ---------- boot ---------- */
function initTheme() {
  let t = "auto";
  try { t = localStorage.getItem("duitku.theme") || "auto"; } catch {}
  if (t !== "auto") document.documentElement.setAttribute("data-theme", t);
}

function boot() {
  initTheme();
  updateHeaderExtra();
  updateNavLabels();

  // Populate brand logo & icons
  const logoEl = $("#brandLogo");
  if (logoEl && !logoEl.firstChild) {
    logoEl.append(el("img", {
      src: "icon.svg",
      alt: "Duitku",
      width: "36",
      height: "36",
      style: "border-radius:10px;display:block;"
    }));
  }
  const fabIcon = $("#fabIcon");
  if (fabIcon && !fabIcon.firstChild) fabIcon.append(icon("plus", 18));
  const deskIcon = $("#desktopCatatIcon");
  if (deskIcon && !deskIcon.firstChild) deskIcon.append(icon("plus", 18));
  $("#desktopCatatBtn")?.addEventListener("click", () => openTxForm());
  $("#navIcon-dashboard")?.append(icon("dashboard", 20));
  $("#navIcon-transaksi")?.append(icon("transaksi", 20));
  $("#navIcon-goals")?.append(icon("target", 20));
  $("#navIcon-lainnya")?.append(icon("lainnya", 20));

  initPwa();
  initBackend();
}

function initPwa() {
  if ("serviceWorker" in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then(reg => {
        reg.update();
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "activated" && navigator.serviceWorker.controller) {
              if (refreshing) return;
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }).catch(() => {});
    });
  }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    state.deferredPrompt = e;
  });
  window.addEventListener("appinstalled", () => {
    state.deferredPrompt = null;
    toast(t("pwa_installed"));
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
